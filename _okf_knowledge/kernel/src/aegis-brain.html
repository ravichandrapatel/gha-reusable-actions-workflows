<!DOCTYPE html>
<!--
FILE_NAME: aegis-brain.html
DESCRIPTION: Self-contained OKF bundle graph (aegis-brain). No backend, no CDN, no
             dependencies. Graph + lint payloads are embedded in this file by
             kernel/okf.py compile / lint (no graph.json / lint.json sidecars).
             When served via okf.py serve, Run Compile / Run Lint refresh via API.
             Features: force graph, declutter panel (labels/orphans/local
             graph), type legend, navigator sidebar, and lint panel.
VERSION: 0.2.11
AUTHORS: contributors
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aegis knowledge system</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #202020;
      --panel2: #262626;
      --text: #dadada;
      --muted: #8a8a8a;
      --accent: #7f6df2;
      --border: #333;
      --error: #f26d78;
      --warning: #f0c674;
      --sidebar-w: 300px;
      --topbar-h: 46px;
      --reader-w: 440px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    #topbar h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
    }

    #topbar h1 span {
      color: var(--accent);
    }

    #legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .key {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 9px;
      background: var(--panel2);
      transition: opacity .15s;
    }

    .key:hover {
      border-color: #3a4157;
    }

    .key.off {
      opacity: 0.35;
      text-decoration: line-through;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }

    #load {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #status {
      color: var(--muted);
      font-size: 12px;
    }

    .tb-btn {
      cursor: pointer;
      background: #232838;
      color: var(--text);
      border: 1px solid #313749;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .tb-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tb-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #side {
      position: fixed;
      top: 46px;
      left: 0;
      bottom: 0;
      width: 300px;
      z-index: 9;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden; /* clip; navlist scrolls inside */
    }

    #searchbox {
      flex: none;
      padding: 10px 12px 6px;
    }

    #searchbox input {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #313749;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    #searchbox input:focus {
      border-color: var(--accent);
    }

    #navlist {
      flex: 1 1 auto;
      min-height: 0; /* required for flex child overflow scroll */
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 6px 8px;
      /* Shared tree columns: chevron/bullet | label | mark */
      --nav-cols: 14px minmax(0, 1fr) auto;
      --nav-gap: 3px;
      --nav-indent: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a4a4a var(--panel2);
    }

    #navlist::-webkit-scrollbar {
      width: 8px;
    }

    #navlist::-webkit-scrollbar-track {
      background: var(--panel2);
    }

    #navlist::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 4px;
    }

    #navlist::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }

    .navgroup summary,
    .navitem {
      display: grid;
      grid-template-columns: var(--nav-cols);
      column-gap: var(--nav-gap);
      align-items: center;
      box-sizing: border-box;
      padding: 5px 10px 5px calc(6px + (var(--depth, 0) * var(--nav-indent)));
      min-height: 26px;
    }

    .navgroup summary {
      cursor: pointer;
      list-style: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      user-select: none;
    }

    .navgroup summary::-webkit-details-marker {
      display: none;
    }

    .navgroup summary::before {
      content: "";
      grid-column: 1;
      width: 14px;
      height: 14px;
      justify-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Expand arrow only when the folder/zone has nested folders or files */
    .navgroup.has-children>summary::before {
      content: "▸";
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      transition: transform .12s;
    }

    .navgroup.has-children[open]>summary::before {
      transform: rotate(90deg);
    }

    .navgroup.zone-group {
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
      padding-bottom: 6px;
    }

    .navgroup.zone-group>summary {
      color: var(--accent);
      font-size: 14px;
    }

    .navgroup.folder-group>summary {
      color: #fff;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
    }

    .navgroup summary .nav-label {
      grid-column: 2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .navitem {
      cursor: pointer;
      border-radius: 6px;
      font-size: 13px;
      color: #fff;
    }

    .navitem:hover {
      background: var(--panel2);
    }

    .navitem.selected {
      background: #23304d;
    }

    .navitem .bullet {
      grid-column: 1;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      justify-self: center;
    }

    .navitem .nav-label {
      grid-column: 2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .navitem .mark {
      grid-column: 3;
      font-size: 12px;
    }

    .tb-status {
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .tb-status .cnt.err {
      color: var(--error);
    }

    .tb-status .cnt.warn {
      color: var(--warning);
    }

    .tb-status .cnt.ok {
      color: #a3d977;
    }

    .tb-status .cnt.idle {
      color: var(--muted);
      font-weight: 500;
    }

    #reader {
      position: fixed;
      top: 46px;
      right: 0;
      bottom: 0;
      width: 440px;
      z-index: 9;
      display: none;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
    }

    #r-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px 4px;
      border-bottom: 1px solid var(--border);
    }

    #r-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    #r-close {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    #r-close:hover {
      background: var(--panel2);
      color: var(--text);
    }

    #r-meta {
      padding: 0 14px 10px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }

    #r-meta .tag {
      display: inline-block;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 8px;
      margin: 2px 3px 0 0;
      font-size: 11px;
    }

    #r-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
      font-size: 13px;
    }

    #r-body h1 {
      font-size: 15px;
      margin: 16px 0 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    #r-body h2 {
      font-size: 14px;
      margin: 14px 0 5px;
    }

    #r-body h3,
    #r-body h4 {
      font-size: 13px;
      margin: 12px 0 4px;
    }

    #r-body p {
      margin: 6px 0;
    }

    #r-body ul,
    #r-body ol {
      margin: 6px 0;
      padding-left: 1.5em;
      list-style-position: outside;
    }

    #r-body li {
      margin: 3px 0;
    }

    #r-body li>ul,
    #r-body li>ol {
      margin: 4px 0 2px;
      padding-left: 1.5em;
    }

    #r-body .li-cont {
      display: block;
      margin: 2px 0 0 1em;
    }

    #r-body code {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-size: 12px;
    }

    #r-body pre {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 12px;
    }

    #r-body pre code {
      background: none;
      border: none;
      padding: 0;
    }

    #r-body table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }

    #r-body th,
    #r-body td {
      border: 1px solid var(--border);
      padding: 4px 8px;
      text-align: left;
    }

    #r-body th {
      background: var(--panel2);
    }

    #r-body a {
      color: var(--accent);
      text-decoration: none;
    }

    #r-body a:hover {
      text-decoration: underline;
    }

    #r-body a.dead {
      color: var(--muted);
      border-bottom: 1px dashed var(--muted);
      cursor: help;
    }

    canvas#c {
      position: fixed;
      z-index: 1;
      top: var(--topbar-h);
      left: var(--sidebar-w);
      right: 0;
      bottom: 0;
      display: block;
      background: var(--bg);
      /* Avoid browser upscaling blur; JS sets the real backing-store size. */
      image-rendering: auto;
    }

    body.reader-open canvas#c {
      right: var(--reader-w);
    }

    #tip {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
      background: var(--panel);
      border: 1px solid #313749;
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 340px;
      font-size: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }

    #tip .t-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    #tip .t-meta {
      color: var(--muted);
    }

    #tip .t-lint.error {
      color: var(--error);
    }

    #tip .t-lint.warning {
      color: var(--warning);
    }

    /* Floating graph controls */
    #declutter {
      position: fixed;
      z-index: 8;
      right: 16px;
      bottom: 16px;
      width: 220px;
      background: rgba(32, 32, 32, 0.92);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 10px 12px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
      font-size: 12px;
      color: var(--text);
    }

    body.reader-open #declutter {
      right: calc(var(--reader-w) + 16px);
    }

    #declutter h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #declutter label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    #declutter label:hover {
      color: #fff;
    }

    #declutter input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }

    #declutter .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }

    #declutter select {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
    }

    #declutter .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div id="topbar">
    <h1>aegis knowledge system</h1>
    <div id="legend"></div>
    <div id="load">
      <span id="status">loading…</span>
      <span id="lintcounts" class="tb-status" title="Lint status"><span class="cnt idle">lint —</span></span>
      <button id="run-lint" class="tb-btn" type="button"
        title="Run vault lint (full scan when served via kernel/okf.py serve)">Run Lint</button>
      <span id="compilecounts" class="tb-status" title="Compile status"><span class="cnt idle">compile —</span></span>
      <button id="run-compile" class="tb-btn" type="button"
        title="Rebuild vault index + re-embed graph (when served via kernel/okf.py serve)">Run Compile</button>
    </div>
  </div>
  <div id="side">
    <div id="searchbox"><input id="search" type="search" placeholder="Search concepts…"></div>
    <div id="navlist"></div>
  </div>
  <canvas id="c"></canvas>
  <div id="declutter">
    <h2>Declutter</h2>
    <div class="row">
      <span>Labels</span>
      <select id="opt-labels" title="When to show node titles">
        <option value="hover">On hover</option>
        <option value="selection">Selection</option>
        <option value="always" selected>Always</option>
        <option value="off">Off</option>
      </select>
    </div>
    <label><input type="checkbox" id="opt-orphans" checked> Hide orphans</label>
    <label><input type="checkbox" id="opt-local" checked> Local graph</label>
    <label><input type="checkbox" id="opt-arrows" checked> Show arrows</label>
    <p class="hint">Local graph shows only the selected note and its neighbors.</p>
  </div>
  <div id="tip"></div>
  <div id="reader">
    <div id="r-head">
      <div id="r-title"></div>
      <button id="r-close" title="Close (Esc)">✕</button>
    </div>
    <div id="r-meta"></div>
    <div id="r-body"></div>
  </div>
  <!-- Data embedded by kernel/okf.py compile and kernel/okf.py lint so
     aegis-brain auto-loads even when opened as file:// (where fetch is blocked). -->
  <script id="graph-data" type="application/json">{
  "nodes": [
    {
      "id": "standards/gha-commit-subjects",
      "type": "Concept",
      "title": "GHA Commit Subjects",
      "description": "Ticket-prefixed conventional commit subjects required for hooks and SemVer bumps.",
      "tags": [
        "standard",
        "github-actions",
        "commits",
        "semver"
      ],
      "content": "# GHA Commit Subjects\n\nHouse rules for subjects in `gha-reusable-actions-workflows`. Enforced by `policies/scripts/commit_message_lib.sh` (global `commit-msg` hook) and Release Manager SemVer.\n\n## MUST\n\n1. Subject **MUST** start with a ticket: `sctask<number>`, `inc<number>`, or `DCDT-<number>` (case-insensitive). Optional `:` after ticket.\n2. Subject **MUST** use a keyword: `feat`, `fix`, `chore`, `docs`, `refactor`, `perf`, `test`, `style`.\n3. Subject **MUST** match one of the four supported ticket+keyword formats documented in the repo README.\n4. Empty subjects **MUST** fail validation.\n5. A `release` **MUST** include at least one `feat`, `fix`, or `chore` since the last component tag (or release fails).\n\n## SHOULD\n\n1. Dependabot commits **SHOULD** use prefix `DCDT-0000 chore`.\n\n## Exemptions\n\n- Merge commits (`Merge ...`) **MUST** be exempt from validation.\n\n## SemVer mapping\n\n| Keyword | Bump |\n| :--- | :--- |\n| `feat` | Minor |\n| `fix`, `chore` | Patch |\n| `docs`, `refactor`, `perf`, `test`, `style` | None |\n\n## Prompt Card\n\n```text\nCommit subject MUST:\n- ticket prefix: sctaskN | incN | DCDT-N (optional :)\n- keyword: feat|fix|chore|docs|refactor|perf|test|style\n- empty subject fails; Merge commits exempt\n- Dependabot SHOULD: DCDT-0000 chore\nSemVer: feat=minor; fix|chore=patch; docs|refactor|perf|test|style=none\nRelease needs \u22651 feat|fix|chore since last tag\n```\n\n## Related\n\n- Concept: [SemVer from commits](/vault/concepts/semver-from-commits.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Standard: [Simplicity First](/standards/simplicity-first.md), [OKF Prompt Injection](/standards/okf-prompt-injection.md)"
    },
    {
      "id": "standards/gha-component-layout",
      "type": "Concept",
      "title": "GHA Component Layout",
      "description": "Required directory contract for composite actions and reusable workflows in the monorepo.",
      "tags": [
        "standard",
        "github-actions",
        "layout",
        "monorepo"
      ],
      "content": "# GHA Component Layout\n\n## MUST\n\n1. Composite actions **MUST** live at `actions/{category}/{name}/`.\n2. Each action directory **MUST** contain `action.yml` (or `action.yaml`) and `readme.md`.\n3. Reusable workflows **MUST** live at `workflows/{category}/{name}/`.\n4. Each workflow directory **MUST** contain exactly one `workflow.yml` (or `.yaml`) and `readme.md`.\n5. Release Manager `component_path` **MUST** start with `actions/` or `workflows/`.\n6. Categories in use today: `common`, `security` (actions); `common`, `archtype` (workflows). Add a category when a real component lands.\n\n## FORBIDDEN\n\n1. Inventing alternate trees outside `actions/` or `workflows/` for publishable components.\n2. Multiple workflow YAML files in one workflow component directory.\n\n## Prompt Card\n\n```text\nLayout MUST:\n- actions/{category}/{name}/ \u2192 action.yml|yaml + readme.md\n- workflows/{category}/{name}/ \u2192 exactly one workflow.yml|yaml + readme.md\n- component_path starts with actions/ or workflows/\n- categories today: actions common|security; workflows common|archtype\nFORBIDDEN: trees outside actions|workflows; multi workflow YAML per dir\n```\n\n## Related\n\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Concept: [GitHub Actions](/vault/concepts/github-actions.md)\n- Playbook: [Author composite action](/vault/playbooks/author-gha-composite-action.md)\n- Standard: [Simplicity First](/standards/simplicity-first.md), [OKF Prompt Injection](/standards/okf-prompt-injection.md)"
    },
    {
      "id": "standards/gha-spvs-yaml",
      "type": "Concept",
      "title": "GHA SPVS YAML",
      "description": "OWASP SPVS Conftest policy catalog for workflow and composite action YAML (MUST pass, no soft-fail).",
      "tags": [
        "standard",
        "github-actions",
        "spvs",
        "conftest",
        "security"
      ],
      "content": "# GHA SPVS YAML\n\nPolicies live under `policies/conftest/github_actions/`. Scan with Conftest namespaces `-n workflow` or `-n composite`. Findings **MUST** fail the scan.\n\n## Permissions (MUST)\n\n| ID | Rule |\n| :--- | :--- |\n| CKV2_SPVS_1 | Every job **MUST** declare `permissions:` |\n| CKV2_SPVS_8 | OIDC cloud login jobs **MUST** have `id-token: write` |\n| CKV2_SPVS_9 | Workflow-level permissions **MUST** be declared; **MUST NOT** grant write on contents/packages/id-token/security-events/deployments at workflow root |\n| CKV2_SPVS_10 | **MUST NOT** use `write-all` |\n| CKV2_SPVS_11 | `contents: write` jobs **MUST** set `environment:` |\n| CKV2_SPVS_15 | **MUST NOT** use `pull_request_target` |\n| CKV2_SPVS_12 | **MUST NOT** use bare `runs-on: self-hosted` |\n| CKV2_GHA_1 | Top-level permissions **MUST NOT** be `write-all` |\n\n## Supply chain and shell (MUST)\n\n| ID | Rule |\n| :--- | :--- |\n| CKV2_SPVS_2 | Bash `run:` **MUST** include `set -euo pipefail` |\n| CKV2_SPVS_3 | **MUST NOT** enable xtrace |\n| CKV2_SPVS_4 | Python invocations **MUST** use `-u` or `PYTHONUNBUFFERED=1` |\n| CKV2_SPVS_5 | Third-party `uses:` **MUST** pin to 40-char SHA, `./`, `docker://`, or approved internal `/actions/` tags |\n| CKV2_SPVS_5B | Local `uses:` **MUST NOT** start with `../` |\n| CKV2_SPVS_6 | `${{ inputs.* }}` **MUST NOT** appear in `run:` strings \u2014 map via `env:` |\n| CKV2_SPVS_13 | **MUST NOT** use curl\\|bash style installers |\n| CKV2_SPVS_7 | **MUST NOT** set static cloud credential env vars |\n| CKV_GHA_1\u20134 | No unsecure commands; no user-controlled context in `run:`; no suspicious curl/nc patterns |\n\n## Policy skips (MUST)\n\nWhen `SPVS_SKIP_POLICY` is set, `SPVS_SKIP_REASON` **MUST** also be set (non-empty) at the same scope. `CKV2_SPVS_5` and `CKV2_SPVS_5B` are paired skips.\n\n## Prompt Card\n\n```text\nSPVS MUST (workflow/composite):\n- every job: permissions: (workflows)\n- bash run: set -euo pipefail; no set -x\n- no ${{ inputs.* }} in run \u2014 map via env\n- uses: 40-char SHA | ./ | docker:// | /actions/ tag; no ../\n- no write-all; no pull_request_target; no bare self-hosted\n- no curl|bash; no AWS_ACCESS_KEY_ID/SECRET/SESSION static env\n- contents:write jobs need environment:\n```\n\n## Related\n\n- Concept: [SPVS lifecycle](/vault/concepts/spvs-lifecycle.md)\n- Concept: [GHA CI pipeline recipe](/vault/concepts/gha-ci-pipeline-recipe.md)\n- Reference: [GHA action pin catalog](/vault/references/gha-action-pin-catalog.md)\n- Standard: [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Playbook: [Run local policy tests](/vault/playbooks/run-gha-local-policy-tests.md)"
    },

      "content": "# Metadata Headers\n\n**Scope:** new/edited files under `_okf_knowledge/kernel/` and other house Python tooling. GHA YAML follows SPVS and component-layout standards.\n\n## File header\n\n```python\n# file_name: okf.py\n# description: Thin CLI caller for the Aegis OKF kernel.\n# version: 1.3.0\n# authors: contributors\n```\n\n## Function / class docstring fields\n\n`intent`, `input`, `output`, `role`, `side_effects` (snake_case) \u2014 match existing kernel style.\n\n## Prompt Card\n\n```text\nKernel/house Python: file headers (file_name, description, version, authors).\nNew functions: intent, input, output, role, side_effects. GHA YAML: SPVS + layout standards.\n```\n\n# Related\n\n- [Simplicity First](/standards/simplicity-first.md)\n- [GHA SPVS YAML](/standards/gha-spvs-yaml.md)"

      "id": "standards/okf-house-schema",
      "type": "Concept",
      "title": "OKF House Schema",
      "description": "Required frontmatter and Prompt Card rules for durable Aegis OKF documents.",
      "tags": [
        "standard",
        "okf",
        "schema",
        "frontmatter"
      ],
      "content": "# OKF House Schema\n\nBinding schema for durable docs under `_okf_knowledge/`. Enforced by `okf.py lint` (required `type`; standards Prompt Card gate).\n\n## Required frontmatter\n\n```yaml\n---\ntype: Concept          # Concept | Playbook | System | Reference | Incident\ntitle: Human-readable name\ndescription: One-line summary for indexes and pack/lookup\ntags: [kebab-case, topic]\ntimestamp: 2026-07-28T00:00:00Z   # ISO-8601 UTC\nstatus: active\n---\n```\n\n| Field | Rule |\n| --- | --- |\n| `type` | **MUST** \u2014 OKF required field |\n| `title`, `description` | **MUST** for house docs (lint warns if missing) |\n| `tags` | **SHOULD**; house rules under `standards/` **MUST** include tag `standard` |\n| `timestamp` | **SHOULD** \u2014 UTC `Z` |\n| `pack_force_when` | Optional keyword list \u2014 pack/lookup force-includes when query matches |\n\n## Prompt Cards\n\n- Binding standards (`standards/` or tag `standard`) **MUST** include a non-empty `## Prompt Card` (lint `DBG-308`).\n- Card body **SHOULD** be \u2264 ~600 characters (~150 tokens).\n- Other agent-facing concepts **SHOULD** ship a card.\n\n## Reserved files\n\nDo not treat as concepts: `index.md`, `log.md` at brain root; compiled `index.json` / `prompt_cards.json` / `graph.json`.\n\n## Prompt Card\n\n```text\nDurable OKF docs MUST have YAML frontmatter with type,title,description,tags,timestamp,status.\nStandards MUST tag standard and ship ## Prompt Card (\u2264~600 chars). Lint enforces type + cards.\n```\n\n# Related\n\n- Retrieval: [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- Maintenance: [Maintain aegis-system](/vault/playbooks/maintain-aegis-system.md)\n- DNA: [AGENTS.md](/AGENTS.md)"
    },
    {
      "id": "standards/okf-prompt-injection",
      "type": "Concept",
      "title": "OKF Prompt Injection",
      "description": "Rule #1 pack/lookup \u2014 inject slim Prompt Cards; retrieval ladder OKF \u2192 corpus \u2192 live \u2192 write-back.",
      "tags": [
        "standard",
        "okf",
        "prompting",
        "tokens",
        "aegis",
        "retrieval"
      ],
      "content": "# OKF Prompt Injection\n\nImplements **Rule #1 \u2014 Pack first** from [AGENTS.md](/AGENTS.md).\n\nCurated OKF stays in the vault. Generation context gets a **dynamic Prompt Pack**: slim `## Prompt Card` text from this turn\u2019s `okf.py pack` / `lookup --card` \u2014 not a full-brain dump.\n\n## Retrieval ladder\n\n| Priority | Lane | How | Use for |\n| :---: | :--- | :--- | :--- |\n| 1 | OKF | `okf.py pack` / `lookup --card` | Standards, playbooks, catalogs, pins on cards |\n| 2 | Card pointers | Read only paths the **current cards** name | One deep dive |\n| 3 | Task corpus | Glob \u2192 Grep \u2192 Read | Product code (`actions/`, `workflows/`, \u2026) |\n| 4 | Live external | Official Git/OCI/`gh` | Pins still missing/stale after 1\u20133 |\n| 5 | Grader | Only to explain/fix a failure | Not for inventing compliance at author time |\n\nLane 1 **MUST** run before corpus or authoring. Write-back durable pins/recipes to `_inbox/` (Rung 1); ingest via maintain playbook.\n\n**FORBIDDEN:** paste `graph.json` / full standards into the prompt; skip pack and grep the vault for compliance; invent stub designs that omit required checkout/artifact/house-action wiring when the task needs them.\n\n## Budgets\n\n- Each card **SHOULD** be \u2264 ~600 characters (~150 tokens).\n- Pack for one turn **SHOULD** stay near the budget passed to `pack` (default guidance ~1200 tokens).\n- Concepts may set `pack_force_when: [keywords]` so pack force-includes them.\n\n## Prompt Card\n\n```text\nRule #1: okf.py pack (or lookup --card) before authoring; inject ## Prompt Card text only.\nLadder: OKF \u2192 card paths \u2192 repo corpus \u2192 live upstream \u2192 write-back _inbox.\nNo graph/full-doc paste; no grader mining to invent compliance.\n```\n\n# Related\n\n- DNA: [AGENTS.md](/AGENTS.md)\n- Schema: [OKF House Schema](/standards/okf-house-schema.md)\n- Pins: [GHA action pin catalog](/vault/references/gha-action-pin-catalog.md)"
    },
    {
      "id": "standards/simplicity-first",
      "type": "Concept",
      "title": "Simplicity First (Laziness Ladder)",
      "description": "Prefer the simplest, shortest, minimal solution that works \u2014 reuse before new files before tooling.",
      "tags": [
        "standard",
        "simplicity",
        "laziness-ladder",
        "principles"
      ],
      "content": "# Laziness Ladder\n\nDesign lens used after Rule #1 (Pack First) in [AGENTS.md](/AGENTS.md). When multiple approaches solve the problem, pick the lowest rung that still works:\n\n| Rung | Approach | Example |\n|------|----------|---------|\n| 1 | Do nothing new | Reuse an existing concept, playbook, or reference |\n| 2 | Edit one file | Fix a link, add one paragraph, patch one script |\n| 3 | Add one small file | One new concept \u2014 not a new directory tree |\n| 4 | Add tooling | Only when manual steps repeat and hurt |\n| 5 | Add abstraction | Last resort \u2014 never start here |\n\n## In the vault\n\n- One concept per file; cross-link instead of duplicating prose.\n- Prefer `index.md` disclosure over bulk-reading the tree.\n- Kernel stays stdlib-only unless a dependency is unavoidable.\n- New types, directories, or tooling require justification against this ladder.\n\n## In code\n\n- Smallest diff that fixes the root cause \u2014 no drive-by refactors.\n- Match existing conventions before inventing new ones.\n\n## Prompt Card\n\n```text\nLaziness Ladder: reuse \u2192 one-file edit \u2192 one small file \u2192 tooling \u2192 abstraction last.\nSmallest diff; stdlib kernel; justify new dirs/types.\n```\n\n# Related\n\n- DNA: [AGENTS.md](/AGENTS.md)\n- Schema: [OKF House Schema](/standards/okf-house-schema.md)\n- Prompt discipline: [OKF Prompt Injection](/standards/okf-prompt-injection.md)"
    },
    {
      "id": "vault/concepts/aegis-capability-discovery",
      "type": "Concept",
      "title": "Aegis Capability Discovery",
      "description": "Probe Brain/FS/Python/Git/Shell before enabling pack/compile/lint; BLOCKED when Brain missing for non-trivial mutate.",
      "tags": [
        "aegis-system",
        "capability",
        "discovery",
        "portable"
      ],
      "content": "# Aegis Capability Discovery\n\n```bash\npython3 _okf_knowledge/kernel/okf.py capabilities [--json] [--strict]\n```\n\nReports present/missing/degraded for Brain, Filesystem, Python, Git, Shell, compile, lint plus `enabled_features` and `runtime_hint` (`READY` | `BLOCKED`). `--strict` exits `4` when blocked.\n\nRun once per non-trivial turn (and on env change). Trivial Q&A may skip. If Python/`okf.py` is missing, probe with shell only \u2014 **never** claim a successful Prompt Pack.\n\nHard rule: non-trivial CREATE/MODIFY with Brain missing \u2192 `BLOCKED`.\n\n## Prompt Card\n\n```text\nNon-trivial: okf.py capabilities [--json] before pack. Enable only reported features.\nBrain missing \u2192 BLOCKED for CREATE/MODIFY. No tool assumptions.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [Extending Aegis](/vault/concepts/extending-aegis.md)\n- [Maintain aegis-system](/vault/playbooks/maintain-aegis-system.md)"
    },
    {
      "id": "vault/concepts/component-tagging",
      "type": "Concept",
      "title": "Component Tagging",
      "description": "safe_name derivation and versioned vs stable tag conventions for GHA components.",
      "tags": [
        "github-actions",
        "tagging",
        "release",
        "concepts"
      ],
      "content": "# Component Tagging\n\n| Item | Rule |\n| :--- | :--- |\n| `safe_name` | Basename of `component_path` (Release Manager rejects duplicate basenames across categories) |\n| Versioned tag | `{safe_name}-{X.Y.Z}` e.g. `janitor-bot-1.2.3` |\n| Stable tag | `{safe_name}-v1` e.g. `janitor-bot-v1` |\n| Promote | Delete remote stable tag then recreate at target SHA (no force-push) |\n| Rollback previous | Sorted versioned tags; previous index of target `{safe_name}-{version}` |\n| Workflow sync | On release, copy `workflows/.../workflow.yml` to `.github/workflows/{name}.yml` then tag |\n\nConsumers typically reference `@v1` (stable) or a versioned tag / commit SHA.\n\n## Prompt Card\n\n```text\nTags: versioned {safe_name}-{X.Y.Z}; stable {safe_name}-v1.\nsafe_name = basename(component_path); duplicate basenames rejected.\nPromote = delete+recreate stable tag at target SHA (never force-push).\nWorkflow release also syncs .github/workflows/{name}.yml before tagging.\n```\n\n## Related\n\n- Concept: [Release Manager modes](/vault/concepts/release-manager-modes.md), [SemVer from commits](/vault/concepts/semver-from-commits.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"
    },
    {
      "id": "vault/concepts/extending-aegis",
      "type": "Concept",
      "title": "Extending Aegis",
      "description": "How to replicate this package and grow domain knowledge without rewriting the kernel.",
      "tags": [
        "aegis-system",
        "getting-started",
        "portable",
        "deploy"
      ],
      "content": "# Extending Aegis\n\n**Package root:** directory containing [`AGENTS.md`](/AGENTS.md) and `_okf_knowledge/`. DNA lives in AGENTS.md; this page is how to ship and grow the package.\n\n## Replicate (copy-paste)\n\nCopy as a unit (keep relative layout):\n\n```\nAGENTS.md\n_okf_knowledge/\n.cursor/rules/aegis-okf.mdc\n.cursor/skills/{aegis-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,aegis-review}/\n.cursor/commands/{aegis-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,aegis-review}.md\n.github/skills/{aegis-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,aegis-review}/\n.github/prompts/{aegis-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,aegis-review}.prompt.md\n.github/agents/aegis-okf.agent.md\n.github/copilot-instructions.md\n.github/instructions/aegis-okf.instructions.md\n.github/instructions/okf-brain.instructions.md\n.github/instructions/gha-spvs.instructions.md\n.github/workflows/okf-lint.yml\n```\n\nPlace at repo root or inside one folder (e.g. `agents/`). From package root:\n\n```bash\npython3 _okf_knowledge/kernel/okf.py compile\npython3 _okf_knowledge/kernel/okf.py lint\n```\n\nRequires Python 3.9+ (kernel is stdlib-only). Keep kernel + DNA; adapt domain cards under `standards/` and `vault/` for the target repo. Include Cursor / Copilot / CI bindings as needed.\n\n## Add knowledge\n\n1. Drop raw notes in [`_inbox/`](/_inbox/).\n2. Follow [Maintain aegis-system](/vault/playbooks/maintain-aegis-system.md).\n\n## Prompt Card\n\n```text\nReplicate: AGENTS.md + _okf_knowledge/ + Cursor (.cursor) and Copilot (.github/skills, prompts, agents, instructions).\nAgent: aegis-okf. Skills/prompts: aegis-discover, okf-pack, grill-me, mutation-gate, okf-writeback, okf-maintain, aegis-review.\nFrom package root: compile + lint. Adapt domain cards; keep kernel + DNA.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [Maintain aegis-system](/vault/playbooks/maintain-aegis-system.md)\n- [Aegis Capability Discovery](/vault/concepts/aegis-capability-discovery.md)"
    },
    {
      "id": "vault/concepts/gha-ci-pipeline-recipe",
      "type": "Concept",
      "title": "GHA CI pipeline recipe",
      "description": "Binding recipe for multi-job reusable CI \u2014 checkout, real artifact sharing, house OWASP action; no stub staging as design.",
      "tags": [
        "github-actions",
        "ci-pipeline",
        "artifacts",
        "owasp",
        "workflow_call"
      ],
      "content": "# GHA CI pipeline recipe\n\nFor multi-job `workflow_call` CI (build \u2192 OWASP \u2192 Sonar \u2192 gate \u2192 publish):\n\n## MUST\n\n1. **Checkout** each job that needs the repo (`actions/checkout@<SHA>` from pin catalog, or `./` wrapper).\n2. **Cross-job artifacts** via `actions/upload-artifact` + `actions/download-artifact` (SHA-pinned). Local `mkdir` staging alone does **not** share across jobs.\n3. **OWASP:** `uses: ./actions/security/owasp-dependency-check` (Podman/ARC; see SPVS lifecycle).\n4. If pins/recipe missing after pack \u2192 **corpus** (`actions/`, `workflows/`) \u2192 **live** upstream \u2192 **write-back** to OKF. Do not invent floating `@vN`.\n\n## FORBIDDEN\n\n1. Approving \u201crun-oriented staging / promote later\u201d as the design when the task requires real artifact sharing.\n2. Stubbing OWASP/Sonar with echo reports when house actions or pin cards exist (or can be resolved via ladder).\n3. Mining grader/Rego to invent compliance while authoring.\n\n## Prompt Card\n\n```text\nCI multi-job MUST: checkout; upload-artifact+download-artifact for cross-job;\nOWASP via ./actions/security/owasp-dependency-check.\nFORBIDDEN: stub local staging as design; @vN tags.\nMissing pins \u2192 corpus \u2192 live \u2192 write-back (never Conftest-green stubs).\n```\n\n## Related\n\n- Reference: [GHA action pin catalog](/vault/references/gha-action-pin-catalog.md)\n- Standards: [GHA SPVS YAML](/standards/gha-spvs-yaml.md), [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- Concepts: [SPVS Lifecycle](/vault/concepts/spvs-lifecycle.md), [GitHub Actions Domain](/vault/concepts/github-actions.md)"
    },
    {
      "id": "vault/concepts/gha-yaml-anchors",
      "type": "Concept",
      "title": "GHA YAML Anchors",
      "description": "Reuse env, steps, or jobs inside one GitHub Actions workflow with YAML anchors (&) and aliases (*) \u2014 no merge keys.",
      "tags": [
        "github-actions",
        "yaml",
        "anchors",
        "workflow",
        "reuse"
      ],
      "content": "# GHA YAML Anchors\n\nGitHub Actions supports YAML **anchors** (`&`) and **aliases** (`*`) to copy configuration within a **single** workflow file. Enabled for all repositories (Sep 2025).\n\n## Syntax\n\n| Mark | Role |\n| :--- | :--- |\n| `&name` | Define an anchor on first use |\n| `*name` | Insert an exact copy of that node |\n\n```yaml\njobs:\n  build:\n    env: &shared_env\n      NODE_ENV: production\n      CI: true\n    steps: &checkout_and_setup\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n      - run: npm ci\n\n  test:\n    env: *shared_env\n    runs-on: ubuntu-latest\n    steps: *checkout_and_setup\n```\n\nReuse an entire job:\n\n```yaml\njobs:\n  unit: &test_job\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm test\n\n  integration: *test_job\n```\n\n## Constraints (MUST know)\n\n| Rule | Detail |\n| :--- | :--- |\n| Same file only | Anchors do **not** cross workflow files |\n| Exact copy only | Alias is a full duplicate of the anchored node |\n| No merge keys | `<<:` is **not** supported \u2014 no base + override |\n\n```yaml\n# FORBIDDEN on GitHub Actions \u2014 merge keys do not work\njob2:\n  <<: *base_job\n  env:\n    EXTRA: true\n```\n\n## When to use what\n\n| Need | Use |\n| :--- | :--- |\n| Same env / steps / job repeated in one file | YAML anchors |\n| Parameterized or cross-repo shared logic | Reusable workflow (`workflow_call`) or composite action |\n| Base job + small per-job diffs | Keep duplication, or extract shared steps into a composite action |\n\nPrefer the simplest rung: if duplication is tiny, skip anchors ([Simplicity First](/standards/simplicity-first.md)).\n\n## Prompt Card\n\n```text\nYAML anchors (&) / aliases (*) reuse nodes within ONE workflow file only.\nAlias = exact copy; merge keys (<<:) FORBIDDEN on GitHub Actions.\nCross-file or parameterized reuse -> reusable workflow / composite action.\nTiny duplication? Skip anchors (Simplicity First).\n```\n\n## Related\n\n- Concept: [GitHub Actions](/vault/concepts/github-actions.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Standard: [GHA component layout](/standards/gha-component-layout.md)\n\n# Citations\n\n1. [Reusing workflow configurations \u2014 YAML anchors and aliases](https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases)\n2. [Changelog: Actions YAML anchors (2025-09-18)](https://github.blog/changelog/2025-09-18-actions-yaml-anchors-and-non-public-workflow-templates/)"
    },
    {
      "id": "vault/concepts/github-actions",
      "type": "Concept",
      "title": "GitHub Actions Domain",
      "description": "Domain routing for composite actions, reusable workflows, Release Manager, and SPVS Conftest in gha-reusable-actions-workflows.",
      "tags": [
        "github-actions",
        "spvs",
        "domain"
      ],
      "content": "# GitHub Actions Domain\n\n**Triggers:** \"github action\", \"reusable workflow\", \"release manager\", \"SPVS\", \"action.yml\", \"workflow_call\", \"promote tag\", \"conftest gha\", \"yaml anchor\", \"workflow alias\"\n\n**Minimum evidence:** component path under `actions/` or `workflows/` (or YAML in `_inbox/`) plus intent (author, review, release, promote, rollback, policy). Halt BLOCKED if unmet.\n\nRoute via Related \u2014 do not restate layout, SPVS rules, SemVer, or release semantics here.\n\n## Prompt Card\n\n```text\nGHA domain: route to layout + gha-spvs-yaml + release-manager-modes cards.\nComponents under actions/{cat}/{name}/ or workflows/{cat}/{name}/ only.\nInject slim cards \u2014 never full SPVS/layout docs.\n```\n\n## Related\n\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Standards: [GHA component layout](/standards/gha-component-layout.md), [GHA SPVS YAML](/standards/gha-spvs-yaml.md), [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- Concepts: [SPVS Lifecycle](/vault/concepts/spvs-lifecycle.md), [GHA CI pipeline recipe](/vault/concepts/gha-ci-pipeline-recipe.md), [Release Manager modes](/vault/concepts/release-manager-modes.md), [SemVer from commits](/vault/concepts/semver-from-commits.md), [GHA YAML Anchors](/vault/concepts/gha-yaml-anchors.md)\n- Reference: [GHA action pin catalog](/vault/references/gha-action-pin-catalog.md)\n- Playbooks: [Author composite action](/vault/playbooks/author-gha-composite-action.md), [Release component](/vault/playbooks/release-gha-component.md)"
    },
    {
      "id": "vault/concepts/release-manager-modes",
      "type": "Concept",
      "title": "Release Manager Modes",
      "description": "release, promote, and rollback semantics for the gha-reusable-actions-workflows Release Manager.",
      "tags": [
        "github-actions",
        "release-manager",

      ],
      "content": "# Release Manager Modes\n\nOrchestrator: `.github/workflows/release-manager.yml` (`workflow_dispatch`).\n\n## Inputs\n\n| Input | Required | Notes |\n| :--- | :--- | :--- |\n| `component_path` | Yes | e.g. `actions/common/janitor-bot` |\n| `mode` | Yes | `release` \\| `promote` \\| `rollback` |\n| `version` | No | Release: auto-derived if empty. Promote/rollback: defaults to latest versioned tag if empty. |\n\n## Stages\n\n1. **Validate** \u2014 path/type, SemVer derivation (release), tag checks\n2. **Security** \u2014 Conftest, Actionlint, Bandit, Shellcheck (**release only**)\n3. **Execute** \u2014 tag, sync workflow file, promote/rollback stable tag\n\nEnvironments: `sandbox` (release), `production` (promote/rollback).\n\n## Mode behavior\n\n| Mode | Security | Result |\n| :--- | :--- | :--- |\n| `release` | Full | Create `{safe_name}-{X.Y.Z}`; sync workflow to `.github/workflows/{name}.yml` when applicable |\n| `promote` | Skipped | Point `{safe_name}-v1` at chosen versioned tag (delete+recreate, no force-push) |\n| `rollback` | Skipped | Move `v1` to previous versioned tag; restore prior workflow file if needed |\n\n## Prompt Card\n\n```text\nRelease Manager (workflow_dispatch): inputs component_path, mode, version(optional).\nrelease = versioned tag + FULL security stage (Conftest/Actionlint/Bandit/Shellcheck).\npromote = move {safe_name}-v1 to chosen tag (security skipped, env production).\nrollback = v1 to previous versioned tag; restore synced workflow file if needed.\n```\n\n## Related\n\n- Concept: [SemVer from commits](/vault/concepts/semver-from-commits.md), [Component tagging](/vault/concepts/component-tagging.md)\n- Playbook: [Release component](/vault/playbooks/release-gha-component.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"
    },
    {
      "id": "vault/concepts/semver-from-commits",
      "type": "Concept",
      "title": "SemVer from Commits",
      "description": "How ticket conventional commits map to SemVer bumps for component tags.",
      "tags": [
        "github-actions",
        "semver",
        "commits",
        "concepts"
      ],
      "content": "# SemVer from Commits\n\nImplemented by `actions/common/semver` using `policies/scripts/commit_message_lib.sh`.\n\n## Rules\n\n1. Lookup latest tag `{safe_name}-[0-9]*`; version is the suffix.\n2. No prior tag: treat current as `0.0.0` then next is **`1.0.0`**.\n3. Scan commits since last tag; classify by keyword.\n4. Any `feat` -> minor bump; else `fix`/`chore` -> patch; else docs/refactor/perf/test/style -> no bump.\n5. Release fails if no bump-capable commits since last tag.\n6. Explicit `version` input on Release Manager bypasses auto-calculation.\n\n## Prompt Card\n\n```text\nSemVer from commits since last {safe_name}-* tag:\nfeat -> minor; fix/chore -> patch; docs/refactor/perf/test/style -> no bump.\nNo prior tag -> first release is 1.0.0. No bump-capable commits -> release FAILS.\nExplicit version input bypasses auto-calculation.\n```\n\n## Related\n\n- Standard: [GHA commit subjects](/standards/gha-commit-subjects.md)\n- Concept: [Release Manager modes](/vault/concepts/release-manager-modes.md), [Component tagging](/vault/concepts/component-tagging.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"
    },
    {
      "id": "vault/concepts/spvs-lifecycle",
      "type": "Concept",
      "title": "SPVS Lifecycle",
      "description": "OWASP SPVS Plan/Integrate/Release/Operate stages mapped onto this monorepo \u2014 plus Dependency-Check runner constraints.",
      "tags": [
        "github-actions",
        "spvs",
        "lifecycle",
        "owasp",
        "concepts"
      ],
      "content": "# SPVS Lifecycle\n\n| Stage | This repository |\n| :--- | :--- |\n| Plan / Develop | Commit-msg hook; ticket conventional commits; SemVer derivation |\n| Integrate | Pre-commit Conftest, Actionlint, Bandit, Shellcheck (change-scoped) |\n| Release | Release Manager security job; versioned tags; workflow sync |\n| Operate | Promote / rollback; stable `v1` tags; branch protection / App bypass |\n\nBranch protection, signed commits, CODEOWNERS are GitHub settings \u2014 not workflow YAML.\n\n## Dependency-Check\n\nWhen scanning with OWASP Dependency-Check: require Podman/ARC-compatible runners; no Docker-only assumptions. YAML policy itself stays in [GHA SPVS YAML](/standards/gha-spvs-yaml.md).\n\n## Prompt Card\n\n```text\nSPVS stages: Plan=commit-msg+SemVer; Integrate=pre-commit Conftest/Actionlint/Bandit/Shellcheck;\nRelease=RM security+tags; Operate=promote/rollback v1.\nBranch protection/CODEOWNERS = GitHub settings, not YAML.\nDependency-Check: Podman/ARC runners only \u2014 no Docker-only assumptions.\n```\n\n## Related\n\n- Standard: [GHA SPVS YAML](/standards/gha-spvs-yaml.md)\n- Concept: [GitHub Actions Domain](/vault/concepts/github-actions.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"

      "id": "vault/playbooks/author-gha-composite-action",
      "type": "Playbook",
      "title": "Author GHA Composite Action",
      "description": "Scaffold and validate a new composite action under actions/{category}/{name}/.",
      "tags": [
        "github-actions",
        "playbook",
        "authoring"
      ],
      "content": "# Trigger\n\nYou need a new composite GitHub Action in the monorepo.\n\n# Preconditions\n\n- Layout standard understood: [GHA component layout](/standards/gha-component-layout.md).\n- Local SPVS tooling available (or use Release Manager later).\n\n# Steps\n\n1. Create `actions/{category}/{name}/` with `action.yml` and `readme.md`.\n2. When an agent authors the action, assemble a **Prompt Pack** with `python3 _okf_knowledge/kernel/okf.py card` on layout + SPVS (+ pins) \u2014 see [OKF Prompt Injection](/standards/okf-prompt-injection.md). **MUST NOT** paste full standards.\n3. Follow SPVS shell/env patterns: `set -euo pipefail`, map inputs via `env`, pin third-party `uses:` to SHA.\n4. Keep `readme.md` short (inputs/outputs + one usage example).\n5. Run Conftest composite scan:\n\n```bash\nconftest test --parser yaml -n composite \\\n  -p policies/conftest/github_actions/composite \\\n  -p policies/conftest/github_actions/lib \\\n  actions/{category}/{name}/action.yml\n```\n\n6. If Conftest fails on `CKV2_SPVS_5`, remediate with a **pin cache** (tag\u2192SHA) rather than asking the agent to discover SHAs from scratch.\n7. Run Bandit/Shellcheck on helpers if present.\n8. Open PR with a ticket-prefixed conventional subject.\n\n# Verification\n\n- [ ] Directory matches layout standard\n- [ ] Conftest composite scan passes\n- [ ] `readme.md` documents inputs/outputs\n- [ ] Agent prompt used a minimal card (not full SPVS dump)\n\n## Prompt Card\n\n```text\nNew composite action: actions/{category}/{name}/ with action.yml + short readme.md.\nShell: set -euo pipefail; map inputs via env (no ${{ inputs.* }} in run);\npin third-party uses: to 40-char SHA (use pin cache on CKV2_SPVS_5).\nGate: conftest test --parser yaml -n composite -p policies/conftest/github_actions/{composite,lib}.\nPR subject: ticket-prefixed conventional commit.\n```\n\n# Related\n\n- Standard: [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- Standard: [GHA SPVS YAML](/standards/gha-spvs-yaml.md), [GHA component layout](/standards/gha-component-layout.md)\n- Concept: [GitHub Actions](/vault/concepts/github-actions.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"
    },

      "type": "Playbook",
      "title": "Bootstrap SPVS Dev Environment",
      "description": "Install local hooks and scanners for gha-reusable-actions-workflows development.",
      "tags": [

      "content": "# Trigger\n\nYou need local commit-msg, pre-commit, Actionlint, Conftest, Bandit, and Shellcheck for this monorepo.\n\n# Preconditions\n\n- Clone at `/home/ghost/workspace-latest/gha-reusable-actions-workflows` (or equivalent).\n- Network access to install pinned tools.\n\n# Steps\n\n1. `cd` to the monorepo root.\n2. Run `bash policies/scripts/install_hooks.sh`.\n3. Confirm `git config --global core.hooksPath` points at `~/.git-templates/hooks`.\n4. Install repo pre-commit: `pre-commit install` (if not done by the installer).\n5. Smoke: `pre-commit run --all-files` on a clean tree (or a small intentional change).\n\n# Verification\n\n- [ ] `commit-msg` rejects a subject without a ticket prefix\n- [ ] `bash policies/tests/run_tests.sh` exits 0\n- [ ] Actionlint/Conftest binaries resolve on PATH\n\n## Prompt Card\n\n```text\nBootstrap: bash policies/scripts/install_hooks.sh from monorepo root;\npre-commit install; smoke with pre-commit run --all-files.\nVerify: commit-msg rejects non-ticket subjects; policies/tests/run_tests.sh exits 0.\n```\n\n# Related\n\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Standard: [GHA commit subjects](/standards/gha-commit-subjects.md)"

    {
      "id": "vault/playbooks/maintain-aegis-system",
      "type": "Playbook",
      "title": "Maintain aegis-system",
      "description": "Add or update durable OKF knowledge \u2014 frontmatter, links, compile, lint.",
      "tags": [
        "aegis-system",
        "ingest",
        "maintenance",
        "okf",
        "procedure"
      ],
      "content": "# Trigger\n\nAdd or change durable knowledge in this package: standard, concept, playbook, system, reference, or incident.\n\n# Preconditions\n\n- Raw material (if any) is in `_inbox/` and not edited in place.\n- You know the `type` and destination directory (table below).\n- Schema: [OKF House Schema](/standards/okf-house-schema.md).\n\n# Destination table\n\n| Content | `type` | Directory |\n| --- | --- | --- |\n| House rule | `Concept` + tag `standard` | `standards/` |\n| Evergreen fact | `Concept` | `vault/concepts/` |\n| Procedure | `Playbook` | `vault/playbooks/` |\n| Running system | `System` | `vault/systems/` |\n| Post-mortem | `Incident` | `vault/incidents/` |\n| Cached upstream / pins | `Reference` | `vault/references/` |\n\n# Steps\n\n1. Create/update one file with required frontmatter.\n2. Standards **MUST** include `## Prompt Card` (\u2264 ~600 chars).\n3. Cross-link both directions; update affected `index.md` files.\n4. Append a line to [log.md](/log.md).\n5. From **package root** (directory with `AGENTS.md`):\n\n```bash\npython3 _okf_knowledge/kernel/okf.py compile\npython3 _okf_knowledge/kernel/okf.py lint\n```\n\n6. Lint must report `0 error(s)`. Archive or delete the `_inbox/` source after successful ingest.\n\n# Change close-out write-back\n\nIf a non-trivial engineering change learned something durable: write `_inbox/<YYYY-MM-DD>-<slug>.md` (Rung 1). Run this playbook for Rung 2 only when destination is clear and the checklist above can finish; else leave `MAINTAIN later`.\n\n# Verification\n\n- [ ] Frontmatter valid\n- [ ] Indexes + cross-links updated\n- [ ] `compile` + `lint` clean\n- [ ] `log.md` updated\n\n## Prompt Card\n\n```text\nBrain mutate: correct type/dir; frontmatter; cross-links; index.md; log.md.\nStandards MUST ## Prompt Card. From package root: okf.py compile then lint (0 errors).\nClose-out: Rung 1 _inbox; Rung 2 only if this checklist finishes.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [OKF House Schema](/standards/okf-house-schema.md)\n- [Extending Aegis](/vault/concepts/extending-aegis.md)"

      "id": "vault/playbooks/release-gha-component",
      "type": "Playbook",
      "title": "Release GHA Component",
      "description": "Run Release Manager mode release/promote/rollback for a monorepo component.",
      "tags": [

      ],
      "content": "# Trigger\n\nYou need to release, promote, or roll back a composite action or reusable workflow.\n\n# Preconditions\n\n- Component path valid under `actions/` or `workflows/`.\n- Secrets `RELEASE_APP_ID` and `RELEASE_APP_PRIVATE_KEY` configured.\n- Understand [Release Manager modes](/vault/concepts/release-manager-modes.md).\n\n# Steps\n\n1. Ensure commits since last tag include `feat`/`fix`/`chore` if auto-bumping ([SemVer from commits](/vault/concepts/semver-from-commits.md)).\n2. Open Actions -> **Release Manager** (`workflow_dispatch`).\n3. Set `component_path` (e.g. `actions/common/janitor-bot`).\n4. Set `mode`:\n   - `release` \u2014 sandbox versioned tag + security stage\n   - `promote` \u2014 move `{safe_name}-v1` to chosen version\n   - `rollback` \u2014 previous versioned tag (+ restore workflow file if needed)\n5. Optionally set `version` to pin SemVer / target.\n6. Wait for Validate -> Security (release only) -> Execute.\n\n# Verification\n\n- [ ] Versioned or stable tag exists remotely as expected ([Component tagging](/vault/concepts/component-tagging.md))\n- [ ] For workflow releases, `.github/workflows/{name}.yml` matches source\n- [ ] Consumers can reference `@v1` after promote\n\n## Prompt Card\n\n```text\nRelease: Actions -> Release Manager (workflow_dispatch); set component_path + mode\n(release|promote|rollback), optional version. Auto-bump needs feat/fix/chore commits\nsince last tag. Verify remote tag ({safe_name}-{X.Y.Z} or -v1) and synced workflow file.\n```\n\n# Related\n\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)\n- Concept: [Release Manager modes](/vault/concepts/release-manager-modes.md)\n- Standard: [GHA commit subjects](/standards/gha-commit-subjects.md)"

      "description": "Execute Conftest verify/scan and policy unit tests for the monorepo.",

      "content": "# Trigger\n\nYou changed Rego policies, action/workflow YAML, or need a full local SPVS gate.\n\n# Preconditions\n\n- Conftest installed (see [Bootstrap SPVS Dev Environment](/vault/playbooks/bootstrap-spvs-dev-environment.md)).\n- Working tree at monorepo root.\n\n# Steps\n\n1. Full suite: `bash policies/tests/run_tests.sh`\n2. Single workflow:\n\n```bash\nconftest test --parser yaml -n workflow \\\n  -p policies/conftest/github_actions/workflow \\\n  -p policies/conftest/github_actions/lib \\\n  path/to/workflow.yml\n```\n\n3. Single composite action:\n\n```bash\nconftest test --parser yaml -n composite \\\n  -p policies/conftest/github_actions/composite \\\n  -p policies/conftest/github_actions/lib \\\n  path/to/action.yml\n```\n\n4. If `policies/conftest/` changed, run `pre-commit run --all-files` (full rescan path).\n\n# Verification\n\n- [ ] `run_tests.sh` exits 0\n- [ ] No open SPVS findings without paired `SPVS_SKIP_POLICY` + `SPVS_SKIP_REASON`\n\n## Prompt Card\n\n```text\nFull gate: bash policies/tests/run_tests.sh (exit 0 required).\nSingle file: conftest test --parser yaml -n workflow|composite\n  -p policies/conftest/github_actions/{workflow|composite} -p .../lib <file>.\nRego changed? pre-commit run --all-files. Skips need SPVS_SKIP_POLICY + SPVS_SKIP_REASON.\n```\n\n# Related\n\n- Standard: [GHA SPVS YAML](/standards/gha-spvs-yaml.md)\n- System: [gha-reusable-actions-workflows](/vault/systems/gha-reusable-actions-workflows.md)"

      "content": "### Common Usage\n\n**Official documentation:** [Workflow syntax for GitHub Actions](https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions)\n\nSee [Standards index](/standards/index.md) for binding house rules.\n\n### Syntax\n\nWorkflow syntax for GitHub Actions - GitHub Docs\nSkip to main content\nCollapse sidebar\n\u2026\n# Workflow syntax for GitHub Actions\nA workflow is a configurable automated process made up of one or more jobs. You must create a YAML file to define your workflow configuration.\nCopy as Markdown\n## In this article\n## About YAML syntax for workflows\nWorkflow files use YAML syntax, and must have either a\n.yml\nor\n\u2026\n## name\nThe name of the workflow. GitHub displays the names of your workflows under your repository's \"Actions\" tab. If you omit\nname\n, GitHub displays the workflow file path relative to the root of the repository.\n## run-name\nThe name for workflow runs generated from the workflow. GitHub displays the workflow run name in the list of workflow runs on your repository's \"Actions\" tab. If\nrun-name\nis omitted or is only whitespace, then the run name is set to event-specific information for the workflow run. For example, for a workflow triggered by a\n\u2026\n### Example of\nrun-name\n```\nrun-name:\n\u2026\n## on\nTo automatically trigger a workflow, use\non\nto define which events can cause the workflow to run. For a list of available events, see\n\u2026\n### Using a single event\nFor example, a workflow with the following\non\nvalue will run when a push is made to any branch in the workflow's repository:\n\u2026\n### Using multiple events\nYou can specify a single event or multiple events. For example, a workflow with the following\non\nvalue will run when a push is made to any branch in the repository or when someone forks the repository:\n\u2026\n### Using activity types\nSome events have activity types that give you more control over when your workflow should run. Use\non.<event_name>.types\nto define the type of event activity that will trigger a workflow run.\n\u2026\n### Using filters\nSome events have filters that give you more control over when your workflow should run.\nFor example, the\npush\n\u2026\n### Using activity types and filters with multiple events\nIf you specify activity types or filters for an event and your workflow triggers on multiple events, you must configure each event separately. You must append a colon (\n:\n) to all events, including events without configuration.\n\u2026\n## on.<event_name>.types\nUse\non.<event_name>.types\nto define the type of activity that will trigger a workflow run. Most GitHub events are triggered by more than one type of activity. For example, the\n\u2026\n## on.<pull_request|pull_request_target>.<branches|branches-ignore>\nWhen using the\npull_request\nand\n\u2026\n### Example: Including branches\nThe patterns defined in\nbranches\nare evaluated against the Git ref's name. For example, the following workflow would run whenever there is a\n\u2026\n# Sequence of patterns matched against refs/heads\n\n    \nbranches:\n\u2026\n### Example: Excluding branches\nWhen a pattern matches the\nbranches-ignore\npattern, the workflow will not run. The patterns defined in\n\u2026\n# Sequence of patterns matched against refs/heads\n\n    \nbranches-ignore:\n\u2026\n### Example: Including and excluding branches\nYou cannot use\nbranches\nand\n\u2026\n## on.push.<branches|tags|branches-ignore|tags-ignore>\nWhen using the\npush\nevent, you can configure a workflow to run on specific branches or tags.\n\u2026\n### Example: Including branches and tags\nThe patterns defined in\nbranches\nand\n\u2026\n# Sequence of patterns matched against refs/heads\n\n    \nbranches:\n\u2026\n# Sequence of patterns matched against refs/tags\n\n    \ntags:\n\u2026\n### Example: Excluding branches and tags\nWhen a pattern matches the\nbranches-ignore\nor\n\u2026\n# Sequence of patterns matched against refs/heads\n\n    \nbranches-ignore:\n\u2026\n# Sequence of patterns matched against refs/tags\n\n    \ntags-ignore:\n\u2026\n### Example: Including and excluding branches and tags\nYou can't use\nbranches\nand\n\u2026\n## on.<push|pull_request|pull_request_target>.<paths|paths-ignore>\nWhen u\n\n\u2026"

    const SIDEBAR_W = 300, TOPBAR_H = 46, READER_W = 440;
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const tip = document.getElementById("tip");
    const statusEl = document.getElementById("status");
    let dpr = 1;

    const opts = {
      labels: "always",   // off | hover | selection | always
      hideOrphans: true,
      localGraph: true,
      arrows: true,
    };

    let nodes = [], edges = [], typeColors = new Map();
    let lint = null;                 // embedded lint report
    let lintByConcept = new Map();   // concept id -> "error" | "warning"

    let selected = null;
    let hoverNode = null;
    let view = { x: 0, y: 0, k: 1 };
    let tween = null;                // {tx, ty, tk} camera target
    let dragNode = null, panning = false, moved = false, last = { x: 0, y: 0 };
    let alpha = 0;                   // simulation temperature

    function bindDeclutter() {
      const labels = document.getElementById("opt-labels");
      const orphans = document.getElementById("opt-orphans");
      const local = document.getElementById("opt-local");
      const arrows = document.getElementById("opt-arrows");
      labels.value = opts.labels;
      orphans.checked = opts.hideOrphans;
      local.checked = opts.localGraph;
      arrows.checked = opts.arrows;
      const bump = () => { alpha = Math.max(alpha, 0.35); };
      labels.addEventListener("change", () => { opts.labels = labels.value; });
      orphans.addEventListener("change", () => { opts.hideOrphans = orphans.checked; bump(); });
      local.addEventListener("change", () => { opts.localGraph = local.checked; bump(); });
      arrows.addEventListener("change", () => { opts.arrows = arrows.checked; });
    }
    bindDeclutter();
    canvas.addEventListener("mouseleave", () => { hoverNode = null; tip.style.display = "none"; });

    function graphSize() {
      const readerW = readerOpen() ? READER_W : 0;
      return {
        w: Math.max(1, innerWidth - SIDEBAR_W - readerW),
        h: Math.max(1, innerHeight - TOPBAR_H),
      };
    }

    function resize() {
      document.body.classList.toggle("reader-open", readerOpen());
      const { w, h } = graphSize();
      dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
      const bw = Math.round(w * dpr);
      const bh = Math.round(h * dpr);
      if (canvas.width !== bw || canvas.height !== bh) {
        canvas.width = bw;
        canvas.height = bh;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      if ("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality = "high";
    }
    addEventListener("resize", resize);

    function pointer(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function centerView() {
      const { w, h } = graphSize();
      view = { x: w / 2, y: h / 2, k: 1 };
    }

    function colorFor(type) {
      if (!typeColors.has(type)) typeColors.set(type, PALETTE[typeColors.size % PALETTE.length]);
      return typeColors.get(type);
    }

    /* ---------- data loading ---------- */

    function setGraph(data) {
      const byId = new Map();
      typeColors = new Map();
      nodes = (data.nodes || []).map((n, i) => {
        const angle = (i / Math.max(1, data.nodes.length)) * Math.PI * 2;
        const node = {
          ...n, color: colorFor(n.type || "?"),
          x: Math.cos(angle) * 260 + (Math.random() - .5) * 40,
          y: Math.sin(angle) * 260 + (Math.random() - .5) * 40,
          vx: 0, vy: 0, deg: 0,
        };
        byId.set(n.id, node);
        return node;
      });
      edges = (data.edges || [])
        .map(e => ({ s: byId.get(e.source), t: byId.get(e.target) }))
        .filter(e => e.s && e.t);
      edges.forEach(e => { e.s.deg++; e.t.deg++; });
      hiddenTypes.clear();
      selected = null;
      resize();
      centerView();
      alpha = 1;
      statusEl.textContent = `${nodes.length} concepts, ${edges.length} links`;
      renderCompileStatus("ok");
      renderLegend(); renderNavigator(); renderReader(); applyLint();
    }

    function renderCompileStatus(state, detail) {
      const el = document.getElementById("compilecounts");
      if (state === "ok") {
        el.innerHTML = `<span class="cnt ok">compiled ✓</span>`;
        el.title = detail || `${nodes.length} concepts, ${edges.length} links`;
      } else if (state === "err") {
        el.innerHTML = `<span class="cnt err">compile failed</span>`;
        el.title = detail || "Compile failed";
      } else {
        el.innerHTML = `<span class="cnt idle">compile —</span>`;
        el.title = detail || "Compile status";
      }
    }

    function setLint(data) {
      lint = data;
      lintByConcept = new Map();
      for (const f of (data.findings || [])) {
        const prev = lintByConcept.get(f.concept);
        if (prev !== "error") lintByConcept.set(f.concept, f.severity);
      }
      applyLint(); renderLint(); renderNavigator();
    }

    function applyLint() {
      for (const n of nodes) n.lint = lintByConcept.get(n.id) || null;
    }

    function loadText(text, label) {
      let data;
      try { data = JSON.parse(text); }
      catch (err) { statusEl.textContent = `could not parse ${label}: ${err.message}`; return; }
      if (Array.isArray(data.nodes)) setGraph(data);
      else if (Array.isArray(data.findings)) setLint(data);
      else statusEl.textContent = `${label}: not a graph or lint payload`;
    }

    /* Load payloads embedded by okf.py compile / lint. */
    function loadEmbedded(id, label) {
      const el = document.getElementById(id);
      const text = el ? el.textContent.trim() : "";
      if (!text || text === "null") return false;
      loadText(text, label);
      return true;
    }
    if (!loadEmbedded("graph-data", "embedded graph")) {
      statusEl.textContent = "no embedded graph (run: python3 kernel/okf.py compile)";

    }
    loadEmbedded("lint-data", "embedded lint");

    /* ---------- legend (click to filter) ---------- */

    function renderLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      for (const [type, color] of typeColors) {
        const el = document.createElement("div");
        el.className = "key" + (hiddenTypes.has(type) ? " off" : "");
        el.innerHTML = `<span class="dot" style="background:${color}"></span>${type}`;
        el.title = "Click to show/hide this type";
        el.addEventListener("click", () => {
          hiddenTypes.has(type) ? hiddenTypes.delete(type) : hiddenTypes.add(type);
          if (selected && hiddenTypes.has(selected.type)) { selected = null; renderReader(); }

        legend.appendChild(el);
      }
    }
