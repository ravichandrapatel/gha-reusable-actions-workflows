# =============================================================================
# FILE_NAME: action.yml
# DESCRIPTION: Match inventory, then allowlisted branch + CI stages.
# VERSION: 2.6.0
# AUTHORS: DevOps Team
# =============================================================================

name: 'Build Preprocess'
description: 'Match inventory.json and allowlisted branch; emit CI stages'

inputs:
  inventory_file:
    description: 'Inventory JSON basename inside this action directory'
    required: false
    default: 'inventory.json'
  repo:
    description: 'Caller owner/repo or repo name to match; empty uses GITHUB_REPOSITORY'
    required: false
    default: ''
  branch:
    description: 'Branch to check; empty uses GITHUB_HEAD_REF then GITHUB_REF_NAME'
    required: false
    default: ''
  app_build_type:
    description: 'App build type: maven, ng-ui, or dotnet'
    required: true
  bot_name:
    description: 'Actor treated as auto-commit bot; other stages skip when github.actor matches'
    required: false
    default: ''
  soft:
    description: 'If true, inventory or branch miss writes false and the step succeeds'
    required: false
    default: 'false'

outputs:
  repos:
    description: 'JSON array of repo names'
    value: ${{ steps.read.outputs.repos }}
  matched:
    description: 'true when the caller repo is listed; false on --soft miss'
    value: ${{ steps.read.outputs.matched }}
  repo:
    description: 'Resolved caller repo used for the inventory match'
    value: ${{ steps.read.outputs.repo }}
  branch:
    description: 'Resolved branch used for the allowlist check'
    value: ${{ steps.branch.outputs.branch }}
  approved:
    description: 'true when the branch matches an approved glob; false on --soft miss'
    value: ${{ steps.branch.outputs.approved }}
  build_stages:
    description: >-
      JSON array of enabled stage names. Gate with
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'owasp')
    value: ${{ steps.branch.outputs.build_stages }}
  auto_commit:
    description: 'true when github.actor matches bot_name'
    value: ${{ steps.branch.outputs.auto_commit }}
  bot_name:
    description: 'Configured auto-commit bot name'
    value: ${{ steps.branch.outputs.bot_name }}
  app_build_type:
    description: 'Validated app build type: maven, ng-ui, or dotnet'
    value: ${{ steps.branch.outputs.app_build_type }}
  template:
    description: 'From project.values TEMPLATE'
    value: ${{ steps.branch.outputs.template }}
  application_name:
    description: 'From project.values APPLICATION_NAME'
    value: ${{ steps.branch.outputs.application_name }}
  organization:
    description: 'From project.values ORGANIZATION'
    value: ${{ steps.branch.outputs.organization }}
  product:
    description: 'From project.values PRODUCT'
    value: ${{ steps.branch.outputs.product }}
  project_description:
    description: 'From project.values PROJECT_DESCRIPTION'
    value: ${{ steps.branch.outputs.project_description }}
  cmdbidnpd:
    description: 'From project.values CMDBIDNPD'
    value: ${{ steps.branch.outputs.cmdbidnpd }}
  cmdbidprd:
    description: 'From project.values CMDBIDPRD'
    value: ${{ steps.branch.outputs.cmdbidprd }}
  teamaadgroupnpg:
    description: 'From project.values TEAMAADGROUPNPG'
    value: ${{ steps.branch.outputs.teamaadgroupnpg }}
  teaaadgroupprd:
    description: 'From project.values TEAAADGROUPPRD'
    value: ${{ steps.branch.outputs.teaaadgroupprd }}
  builder_base_image:
    description: 'From build.values BUILDER_BASE_IMAGE'
    value: ${{ steps.branch.outputs.builder_base_image }}
  cpgbuild_app_origin:
    description: 'From build.values CPGBUILD_APP_ORIGIN (or CPGBUILD_APPORIGIN), stripped'
    value: ${{ steps.branch.outputs.cpgbuild_app_origin }}
  checkstyle_skip:
    description: 'true when cpgbuild_app_origin is non-empty; false otherwise'
    value: ${{ steps.branch.outputs.checkstyle_skip }}
  lib_01:
    description: 'Optional from build.values LIB_01 (empty when unset)'
    value: ${{ steps.branch.outputs.lib_01 }}
  lib_02:
    description: 'Optional from build.values LIB_02 (empty when unset)'
    value: ${{ steps.branch.outputs.lib_02 }}
  lib_03:
    description: 'Optional from build.values LIB_03 (empty when unset)'
    value: ${{ steps.branch.outputs.lib_03 }}
  is_library:
    description: 'maven/dotnet: n when project.values has TEMPLATE; y when TEMPLATE is missing'
    value: ${{ steps.branch.outputs.is_library }}
  sonar_inclusions:
    description: '-Dsonar.inclusions=<list> when CPGBUILD_SONAR_INCLUSION_LIST is set in build.values'
    value: ${{ steps.branch.outputs.sonar_inclusions }}
  sonar_exclusions:
    description: '-Dsonar.exclusions=<list> when CPGBUILD_SONAR_EXCLUSION_LIST is set in build.values'
    value: ${{ steps.branch.outputs.sonar_exclusions }}
  sonar_cli_args:
    description: 'Joined sonar inclusion and exclusion -D arguments'
    value: ${{ steps.branch.outputs.sonar_cli_args }}
  application_version:
    description: 'package.json version (ng-ui) or pom parent/version if present else project version (maven)'
    value: ${{ steps.branch.outputs.application_version }}
  parent_version:
    description: 'ng-ui @test/components version when declared; maven parent/version'
    value: ${{ steps.branch.outputs.parent_version }}
  project_version:
    description: 'ng-ui package.json version; maven project version (SNAPSHOT left as-is)'
    value: ${{ steps.branch.outputs.project_version }}
  name:
    description: 'From pom.xml name when app_build_type is maven'
    value: ${{ steps.branch.outputs.name }}
  java_version:
    description: 'From pom.xml properties/java.version when app_build_type is maven'
    value: ${{ steps.branch.outputs.java_version }}
  node_version:
    description: 'From package.json engines.node or .nvmrc/.node-version when app_build_type is ng-ui'
    value: ${{ steps.branch.outputs.node_version }}
  dotnet_version:
    description: 'From global.json sdk.version when app_build_type is dotnet'
    value: ${{ steps.branch.outputs.dotnet_version }}

runs:
  using: composite
  steps:
    - name: Match caller against inventory
      id: read
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INVENTORY_FILE: ${{ inputs.inventory_file }}
        REPO: ${{ inputs.repo }}
        SOFT: ${{ inputs.soft }}
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail
        ARGS=(
          --action-path "${ACTION_PATH}"
          --inventory-file "${INVENTORY_FILE}"
          --output "${GITHUB_OUTPUT}"
        )
        if [[ -n "${REPO}" ]]; then
          ARGS+=(--repo "${REPO}")
        fi
        if [[ "${SOFT}" == "true" ]]; then
          ARGS+=(--soft)
        fi
        python3 -u "${ACTION_PATH}/checkInventory.py" "${ARGS[@]}"

    - name: Check branch and emit stages
      id: branch
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH: ${{ inputs.branch }}
        APP_BUILD_TYPE: ${{ inputs.app_build_type }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        BOT_NAME: ${{ inputs.bot_name }}
        PYTHONUNBUFFERED: "1"
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      run: |
        set -euo pipefail
        python3 -m pip install --user --quiet --disable-pip-version-check -r "${ACTION_PATH}/requirements.txt"
        ARGS=(
          --app-build-type "${APP_BUILD_TYPE}"
          --event "${EVENT_NAME}"
          --actor "${ACTOR}"
          --output "${GITHUB_OUTPUT}"
        )
        if [[ -n "${BRANCH}" ]]; then
          ARGS+=(--branch "${BRANCH}")
        fi
        if [[ -n "${BOT_NAME}" ]]; then
          ARGS+=(--bot-name "${BOT_NAME}")
        fi
        python3 -u "${ACTION_PATH}/preprocess.py" "${ARGS[@]}"
