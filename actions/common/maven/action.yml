# =============================================================================
# FILE_NAME: action.yml
# DESCRIPTION: Run Maven with caller-supplied goals and CLI arguments.
# VERSION: 2.9.0
# AUTHORS: DevOps Team
# =============================================================================

name: 'Maven'
description: 'Install Maven CLI and run mvn in GITHUB_WORKSPACE; pair with actions/setup-java for Java'

inputs:
  args:
    description: 'Maven goals and options (e.g. clean package -DskipTests or deploy)'
    required: true
  maven-version:
    description: 'Apache Maven CLI version to install; empty auto-detects from pom.xml, then 3.9.9'
    required: false
    default: ''
  maven-opts:
    description: 'Value for MAVEN_OPTS environment variable'
    required: false
    default: ''

outputs:
  exit_code:
    description: 'Maven process exit code'
    value: ${{ steps.maven-goals.outputs.exit_code }}
  java_home:
    description: 'JAVA_HOME from the runner (typically set by actions/setup-java)'
    value: ${{ steps.maven-goals.outputs.java_home }}
  maven_version:
    description: 'Installed Apache Maven CLI version'
    value: ${{ steps.install.outputs.maven_version }}
  settings_path:
    description: 'Path to generated settings.xml ($GITHUB_WORKSPACE/maven/settings.xml)'
    value: ${{ steps.settings.outputs.settings_path }}

runs:
  using: composite
  steps:
    - name: Generate settings.xml
      id: settings
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        tmpl="${ACTION_PATH}/settings.xml.tmpl"
        if [[ ! -f "${tmpl}" ]]; then
          echo "::error::missing settings template: ${tmpl}" >&2
          exit 1
        fi
        ws="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
        out="${ws}/maven/settings.xml"
        mkdir -p "$(dirname "${out}")"
        cp -f "${tmpl}" "${out}"
        chmod 600 "${out}"
        echo "Wrote ${out}"
        echo "settings_path=${out}" >> "${GITHUB_OUTPUT}"

    - name: Configure git for jgit
      shell: bash
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        echo "git user.name=$(git config --global --get user.name)"
        echo "git user.email=$(git config --global --get user.email)"

    - name: Install Maven CLI
      id: install
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

        if [[ -n "${MAVEN_VERSION:-}" ]]; then
          version="${MAVEN_VERSION}"
        elif [[ -f pom.xml ]]; then
          version="$(
            grep -E '<maven\.version>' pom.xml \
              | sed -E 's#.*<maven\.version>[[:space:]]*([^<[:space:]]+)[[:space:]]*</maven\.version>.*#\1#' \
              | head -1 \
              | tr -d '[:space:]'
          )"
          version="${version:-3.9.9}"
        else
          version="3.9.9"
        fi

        echo "maven_version=${version}" >> "${GITHUB_OUTPUT}"
        cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/gha-tools}"
        install_dir="${cache_root}/Maven/${version}/x64"
        mvn_bin="${install_dir}/bin/mvn"

        if [[ ! -x "${mvn_bin}" ]]; then
          url="https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
          echo "Installing Apache Maven CLI ${version}"
          tmp="$(mktemp -d)"
          curl -fsSL "${url}" -o "${tmp}/maven.tgz"
          mkdir -p "${install_dir}"
          tar -xzf "${tmp}/maven.tgz" -C "${tmp}"
          cp -a "${tmp}/apache-maven-${version}/." "${install_dir}/"
          rm -rf "${tmp}"
        fi

        echo "MAVEN_HOME=${install_dir}" >> "${GITHUB_ENV}"
        echo "PATH=${install_dir}/bin:${PATH}" >> "${GITHUB_ENV}"
        echo "MAVEN_EXECUTABLE=${mvn_bin}" >> "${GITHUB_ENV}"
        "${mvn_bin}" -version

    - name: maven-goals
      id: maven-goals
      shell: bash
      env:
        MAVEN_ARGS: ${{ inputs.args }}
        MAVEN_OPTS: ${{ inputs.maven-opts }}
        SETTINGS_PATH: ${{ steps.settings.outputs.settings_path }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
        [[ -n "${MAVEN_OPTS:-}" ]] && export MAVEN_OPTS
        [[ -n "${JAVA_HOME:-}" ]] && echo "java_home=${JAVA_HOME}" >> "${GITHUB_OUTPUT}"

        executable="${MAVEN_EXECUTABLE:-mvn}"
        IFS=' ' read -r -a args <<< "${MAVEN_ARGS}"

        echo "+ ${executable} -s ${SETTINGS_PATH} ${args[*]}"
        "${executable}" -s "${SETTINGS_PATH}" "${args[@]}"
        echo "exit_code=0" >> "${GITHUB_OUTPUT}"

    - name: Cleanup settings.xml
      if: always()
      shell: bash
      env:
        SETTINGS_PATH: ${{ steps.settings.outputs.settings_path }}
      run: |
        set -euo pipefail
        path="${SETTINGS_PATH:-${GITHUB_WORKSPACE}/maven/settings.xml}"
        if [[ -f "${path}" ]]; then
          : > "${path}" || true
          rm -f "${path}"
          echo "Removed ${path}"
        fi
