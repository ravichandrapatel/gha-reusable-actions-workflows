# =============================================================================
# FILE_NAME: action.yml
# DESCRIPTION: Run Maven with caller-supplied goals and CLI arguments.
# VERSION: 3.1.0
# AUTHORS: DevOps Team
# =============================================================================

name: 'Maven'
description: 'Generate settings, configure git, and run mvn in GITHUB_WORKSPACE; pair with setup-java and a workflow Maven install'

inputs:
  MAVEN_ARGS:
    description: 'Maven goals and options (e.g. clean package -DskipTests or deploy)'
    required: true
  MAVEN_SETTINGS_PATH:
    description: 'Path to settings.xml passed to mvn -s'
    required: false
    default: "${{ github.workspace }}/maven/settings.xml"

runs:
  using: composite
  steps:
    - name: Generate settings.xml
      id: settings
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MAVEN_SETTINGS_PATH: ${{ inputs.MAVEN_SETTINGS_PATH }}
      run: |
        set -euo pipefail
        tmpl="${ACTION_PATH}/settings.xml.tmpl"
        if [[ ! -f "${tmpl}" ]]; then
          echo "::error::missing settings template: ${tmpl}" >&2
          exit 1
        fi
        out="${MAVEN_SETTINGS_PATH:?MAVEN_SETTINGS_PATH is required}"
        mkdir -p "$(dirname "${out}")"
        cp -f "${tmpl}" "${out}"
        chmod 600 "${out}"
        echo "Wrote ${out}"
        echo "settings_path=${out}" >> "${GITHUB_OUTPUT}"

    - name: Configure git for jgit
      shell: bash
      run: |
        set -euo pipefail
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        echo "git user.name=$(git config --global --get user.name)"
        echo "git user.email=$(git config --global --get user.email)"

    - name: maven-goals
      id: maven-goals
      shell: bash
      env:
        MAVEN_ARGS: ${{ inputs.MAVEN_ARGS }}
        MAVEN_SETTINGS_PATH: ${{ inputs.MAVEN_SETTINGS_PATH }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
        [[ -n "${MAVEN_OPTS:-}" ]] && export MAVEN_OPTS

        executable="${MAVEN_EXECUTABLE:-mvn}"
        settings="${MAVEN_SETTINGS_PATH:?MAVEN_SETTINGS_PATH is required}"
        IFS=' ' read -r -a args <<< "${MAVEN_ARGS}"

        echo "+ ${executable} -s ${settings} ${args[*]}"
        "${executable}" -s "${settings}" "${args[@]}"
        echo "exit_code=0" >> "${GITHUB_OUTPUT}"

    - name: Cleanup settings.xml
      if: always()
      shell: bash
      env:
        MAVEN_SETTINGS_PATH: ${{ inputs.MAVEN_SETTINGS_PATH }}
      run: |
        set -euo pipefail
        path="${MAVEN_SETTINGS_PATH:-${GITHUB_WORKSPACE}/maven/settings.xml}"
        if [[ -f "${path}" ]]; then
          echo "Found settings file at ${path}; purging"
          : > "${path}" || true
          rm -f "${path}"
          echo "Removed ${path}"
        else
          echo "Settings file already removed or missing: ${path}"
        fi
