# Helm values: gha-runner-scale-set 0.13.1 with containerMode.type=kubernetes-novolume.
# Chart 0.13.1 emits volumes/volumeMounts: null unless a list is provided (actions/actions-runner-controller#4411).
githubConfigUrl: "https://github.com/ravichandrapatel/gha-reusable-actions-workflows"
githubConfigSecret: github-config
runnerGroup: default
minRunners: 0
maxRunners: 2

containerMode:
  type: kubernetes-novolume

# controllerServiceAccount.namespace is a helm-time stub; overlay `namespace:`
# replacements rewrite the rendered manager RoleBinding subject.
controllerServiceAccount:
  name: gha-runner-scale-set-controller-gha-rs-controller
  namespace: CHANGE_ME

template:
  spec:
    # ROSA/OpenShift SCC github-arc (uid 1001, gid 123). Uncomment on ROSA.
    # securityContext:
    #   fsGroup: 123
    volumes:
      - name: novolume-placeholder
        emptyDir: {}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #       - ALL
        #   runAsNonRoot: true
        #   runAsUser: 1001
        #   runAsGroup: 123
        volumeMounts:
          - name: novolume-placeholder
            mountPath: /tmp/novolume-placeholder
