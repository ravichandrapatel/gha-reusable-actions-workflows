# SecretStore reads AWS Secrets Manager via IRSA on ServiceAccount arc-eso.
# Requires External Secrets Operator already installed on the cluster.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  labels:
    app.kubernetes.io/part-of: github-arc
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: arc-eso
