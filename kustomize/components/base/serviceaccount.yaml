# IRSA ServiceAccount for External Secrets Operator (ROSA / EKS).
# Patch eks.amazonaws.com/role-arn in the ROSA overlay before apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-eso
  labels:
    app.kubernetes.io/name: arc-eso
    app.kubernetes.io/part-of: github-arc
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/arc-eso
---
# Optional runner job AWS access. Unused by ARC itself; bind from a job template if needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-aws
  labels:
    app.kubernetes.io/name: arc-runner-aws
    app.kubernetes.io/part-of: github-arc
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/arc-runner
