# Helm values for gha-runner-scale-set-controller 0.13.1
replicaCount: 1

serviceAccount:
  create: true

# ROSA/OpenShift SCC github-arc (uid 1001, gid 123). Uncomment on ROSA.
# podSecurityContext:
#   fsGroup: 123
# securityContext:
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop:
#       - ALL
#   runAsNonRoot: true
#   runAsUser: 1001
#   runAsGroup: 123

flags:
  logLevel: info
  logFormat: json
  updateStrategy: immediate
  runnerMaxConcurrentReconciles: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
