# Materializes Kubernetes secret github-config for gha-runner-scale-set githubConfigSecret.
# App id / installation id are rendered here. The private key stays in Secrets Manager.
# Overlay `namespace:` stamps this object; do not hardcode metadata.namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-config
  labels:
    app.kubernetes.io/part-of: github-arc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: github-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_app_id: "3843629"
        github_app_installation_id: "149912085"
        github_app_private_key: "{{ .private_key }}"
  data:
    - secretKey: private_key
      remoteRef:
        key: github/arc
        property: github_app_private_key
