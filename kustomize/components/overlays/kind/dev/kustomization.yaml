# Change `namespace:` only. Replacements copy it onto the Namespace name and
# helm manager RoleBinding subjects (helm values cannot see this field).
replacements:
  - source:
      kind: ServiceAccount
      name: gha-runner-scale-set-controller-gha-rs-controller
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.name
      - select:
          kind: RoleBinding
          name: gha-runner-scale-set-gha-rs-manager
        fieldPaths:
          - subjects.0.namespace
      - select:
          kind: RoleBinding
          name: gha-runner-scale-set-kubernetes-gha-rs-manager
        fieldPaths:
          - subjects.0.namespace
      - select:
          kind: RoleBinding
          name: gha-runner-scale-set-k8s-novolume-gha-rs-manager
        fieldPaths:
          - subjects.0.namespace
  # Uncomment with ../../../base so SCC RoleBinding subjects get this namespace.
