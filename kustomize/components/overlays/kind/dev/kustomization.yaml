apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Change this field only. Replacements + the namespace transformer follow it.
namespace: devtools-ci
resources:
  - namespace.yaml
  - ../../../base/controller/0.13.1
  - ../../../base/runner/0.13.1
  - ../../../base/runner-kubernetes/0.13.1
  - ../../../base/runner-kubernetes-novolume/0.13.1
# ROSA/EKS only: SA + ESO + SCC. Do not uncomment on kind (no ESO/OpenShift APIs).
#   - ../../../base
# Per-environment image pins. Uncomment and set newName/newTag/digest.
# `name` must match the image Helm rendered from base values.
# images: does not rewrite env values; also uncomment the image replacements below.
# images:
#   - name: ghcr.io/actions/gha-runner-scale-set-controller
#     newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/arc-controller
#     newTag: "0.13.1-dev"
#   - name: ghcr.io/actions/actions-runner
#     newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/actions-runner
#     newTag: "2.328.0-dev"
