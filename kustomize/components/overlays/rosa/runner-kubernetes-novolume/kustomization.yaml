apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Change this field only. Replacements + the namespace transformer follow it.
namespace: devtools-ci
resources:
  - ../../../base
  - ../../../base/runner-kubernetes-novolume/0.13.1
replacements:
  - source:
      kind: ServiceAccount
      name: arc-eso
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.name
      - select:
          kind: RoleBinding
          name: gha-runner-scale-set-k8s-novolume-gha-rs-manager
        fieldPaths:
          - subjects.0.namespace
      - select:
          kind: RoleBinding
          name: github-arc-scc
        fieldPaths:
          - subjects.0.namespace
          - subjects.1.namespace
          - subjects.2.namespace
          - subjects.3.namespace
          - subjects.4.namespace
        options:
          create: true
