apiVersion: v1
kind: Namespace
metadata:
  name: arc-demo-nodejs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-arc-demo
  namespace: arc-demo-nodejs
  labels:
    app: nodejs-arc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-arc-demo
  template:
    metadata:
      labels:
        app: nodejs-arc-demo
    spec:
      containers:
        - name: app
          image: node:20-bookworm-slim
          workingDir: /app
          command: ["node", "src/server.js"]
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-arc-demo
  namespace: arc-demo-nodejs
spec:
  selector:
    app: nodejs-arc-demo
  ports:
    - port: 80
      targetPort: 3000
