# =============================================================================
# FILE_NAME: workflow.yml
# DESCRIPTION: Reusable Maven CI — preprocess, build/test, OWASP, Sonar, Nexus deploy, S2I docker.
# VERSION: 1.4.0
# AUTHORS: DevOps Team
# =============================================================================

name: maven-build-pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (Podman required for OWASP)
        type: string
        required: false
        default: ubuntu-latest
      bot_name:
        description: Optional auto-commit bot override; empty auto-detects actors ending in [bot]
        type: string
        required: false
        default: ""
      maven_version:
        description: Optional Apache Maven CLI version; empty auto-detects from pom.xml then 3.9.9
        type: string
        required: false
        default: ""
      scan_profile:
        description: OWASP scan profile for Maven apps (auto → maven)
        type: string
        required: false
        default: auto
      maven_build_args:
        description: Maven goals for build-and-unit-test
        type: string
        required: false
        default: clean verify -DskipTests
      maven_publish_args:
        description: Maven goals for Nexus publish (snapshot and release)
        type: string
        required: false
        default: deploy -DskipTests
      sonar_host_url:
        description: SonarQube server URL
        type: string
        required: true
      sonar_project_key:
        description: Sonar project key; empty uses preprocess application_name
        type: string
        required: false
        default: ""
      sonar_platform:
        description: Sonar tag platform-<value>
        type: string
        required: false
        default: cap
      docker_registry:
        description: Nexus registry host for s2i-build-and-push
        type: string
        required: false
        default: ""
      docker_environment:
        description: Image path segment after organization
        type: string
        required: false
        default: production
      deploy_environment:
        description: GitHub Environment for contents:write publish
        type: string
        required: false
        default: ci-publish
    outputs:
      build_and_unit_test:
        description: true when build-and-unit-test should run
        value: ${{ jobs.build-preprocess.outputs.build_and_unit_test }}
      owasp:
        description: true when owasp should run
        value: ${{ jobs.build-preprocess.outputs.owasp }}
      sonar:
        description: true when sonar should run
        value: ${{ jobs.build-preprocess.outputs.sonar }}
      checkstyle_skip:
        description: true when CPGBUILD_APP_ORIGIN is set
        value: ${{ jobs.build-preprocess.outputs.checkstyle_skip }}
      cpgbuild_app_origin:
        description: From build.values CPGBUILD_APP_ORIGIN
        value: ${{ jobs.build-preprocess.outputs.cpgbuild_app_origin }}
      lib_01:
        description: Optional LIB_01 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_01 }}
      lib_02:
        description: Optional LIB_02 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_02 }}
      lib_03:
        description: Optional LIB_03 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_03 }}
      application_name:
        description: From project.values
        value: ${{ jobs.build-preprocess.outputs.application_name }}
      application_version:
        description: Maven application version from pom.xml
        value: ${{ jobs.build-preprocess.outputs.application_version }}
      project_version:
        description: Maven project version from pom.xml
        value: ${{ jobs.build-preprocess.outputs.project_version }}
      quality_gate_status:
        description: Sonar quality gate from branch scan
        value: ${{ jobs.sonarqube.outputs.quality_gate_status }}
      docker_image:
        description: Pushed image reference
        value: ${{ jobs.docker-build.outputs.image }}

permissions:
  contents: read

jobs:
  build-preprocess:
    name: build-preprocess
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      build_and_unit_test: ${{ steps.preprocess.outputs.build_and_unit_test }}
      owasp: ${{ steps.preprocess.outputs.owasp }}
      sonar: ${{ steps.preprocess.outputs.sonar }}
      snapshot_artifact: ${{ steps.preprocess.outputs.snapshot_artifact }}
      release_artifact: ${{ steps.preprocess.outputs.release_artifact }}
      docker: ${{ steps.preprocess.outputs.docker }}
      checkstyle_skip: ${{ steps.preprocess.outputs.checkstyle_skip }}
      cpgbuild_app_origin: ${{ steps.preprocess.outputs.cpgbuild_app_origin }}
      lib_01: ${{ steps.preprocess.outputs.lib_01 }}
      lib_02: ${{ steps.preprocess.outputs.lib_02 }}
      lib_03: ${{ steps.preprocess.outputs.lib_03 }}
      application_name: ${{ steps.preprocess.outputs.application_name }}
      application_version: ${{ steps.preprocess.outputs.application_version }}
      project_version: ${{ steps.preprocess.outputs.project_version }}
      organization: ${{ steps.preprocess.outputs.organization }}
      product: ${{ steps.preprocess.outputs.product }}
      sonar_cli_args: ${{ steps.preprocess.outputs.sonar_cli_args }}
      branch: ${{ steps.preprocess.outputs.branch }}
      java_version: ${{ steps.preprocess.outputs.java_version }}
      artifact_id: ${{ steps.preprocess.outputs.artifact_id }}
      builder_base_image: ${{ steps.preprocess.outputs.builder_base_image }}
      is_library: ${{ steps.preprocess.outputs.is_library }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build preprocess
        id: preprocess
        uses: ./actions/common/build-preprocess
        with:
          app_build_type: maven
          bot_name: ${{ inputs.bot_name }}

  build-and-unit-test:
    name: build-and-unit-test
    needs: [build-preprocess]
    if: needs.build-preprocess.outputs.build_and_unit_test == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ needs.build-preprocess.outputs.java_version }}
          cache: maven

      - name: Install Maven CLI
        env:
          MAVEN_VERSION: ${{ inputs.maven_version }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

          if [[ -n "${MAVEN_VERSION:-}" ]]; then
            version="${MAVEN_VERSION}"
          elif [[ -f pom.xml ]]; then
            version="$(
              grep -E '<maven\.version>' pom.xml \
                | sed -E 's#.*<maven\.version>[[:space:]]*([^<[:space:]]+)[[:space:]]*</maven\.version>.*#\1#' \
                | head -1 \
                | tr -d '[:space:]'
            )"
            version="${version:-3.9.9}"
          else
            version="3.9.9"
          fi

          echo "maven_version=${version}"
          cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/gha-tools}"
          install_dir="${cache_root}/Maven/${version}/x64"
          mvn_bin="${install_dir}/bin/mvn"

          if [[ ! -x "${mvn_bin}" ]]; then
            url="https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
            echo "Installing Apache Maven CLI ${version}"
            tmp="$(mktemp -d)"
            curl -fsSL "${url}" -o "${tmp}/maven.tgz"
            mkdir -p "${install_dir}"
            tar -xzf "${tmp}/maven.tgz" -C "${tmp}"
            cp -a "${tmp}/apache-maven-${version}/." "${install_dir}/"
            rm -rf "${tmp}"
          fi

          echo "MAVEN_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "PATH=${install_dir}/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "MAVEN_EXECUTABLE=${mvn_bin}" >> "${GITHUB_ENV}"
          "${mvn_bin}" -version

      - name: Maven build and test
        uses: ./actions/common/maven
        with:
          MAVEN_ARGS: >-
            ${{ inputs.maven_build_args }}${{ needs.build-preprocess.outputs.checkstyle_skip == 'true' && ' -Dcheckstyle.skip=true' || '' }}

      - name: Upload Maven target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-target
          path: target
          if-no-files-found: error
          retention-days: 7

      - name: Upload JaCoCo report
        if: hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-jacoco
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 7

  owasp:
    name: owasp
    needs: [build-preprocess]
    if: needs.build-preprocess.outputs.owasp == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve OWASP scan profile
        id: owasp_profile
        env:
          INPUT_PROFILE: ${{ inputs.scan_profile }}
        run: |
          set -euo pipefail
          PROFILE="${INPUT_PROFILE:-maven}"
          if [[ "${PROFILE}" == "auto" || -z "${PROFILE}" ]]; then
            PROFILE="maven"
          fi
          case "${PROFILE}" in
            maven|maven-ui|maven-svc|jsb-ui|jcr-ui|jsts-ui|jsb-svc|jcr-svc|jsts-svc)
              echo "profile=maven" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "ERROR: maven pipeline scan_profile must be auto or maven (got '${INPUT_PROFILE}')" >&2
              exit 1
              ;;
          esac

      - name: Restore OWASP NVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .owasp-data
          key: maven-owasp-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-owasp-

      - name: OWASP Dependency-Check
        uses: ./actions/security/owasp-dependency-check
        with:
          scan_profile: ${{ steps.owasp_profile.outputs.profile }}
          project: ${{ needs.build-preprocess.outputs.application_name }}
          path: .
          out: reports
          data_dir: ${{ github.workspace }}/.owasp-data
          nvdApiKey: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-report
          path: reports
          if-no-files-found: error
          retention-days: 7

  sonarqube:
    name: sonarqube
    needs: [build-preprocess, build-and-unit-test, owasp]
    if: >-
      needs.build-and-unit-test.result == 'success'
      && (needs.owasp.result == 'success' || needs.owasp.result == 'skipped')
      && needs.build-preprocess.outputs.sonar == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      quality_gate_status: ${{ steps.scan.outputs.quality_gate_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download JaCoCo report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-jacoco
          path: target/site/jacoco

      - name: Download OWASP reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owasp-report
          path: reports

      - name: Resolve Sonar project key
        id: sonar_meta
        env:
          KEY_IN: ${{ inputs.sonar_project_key }}
          APP: ${{ needs.build-preprocess.outputs.application_name }}
        run: |
          set -euo pipefail
          KEY="${KEY_IN}"
          if [[ -z "${KEY}" ]]; then
            KEY="${APP}"
          fi
          if [[ ! "${KEY}" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "ERROR: sonar project key '${KEY}' is invalid" >&2
            exit 1
          fi
          echo "project_key=${KEY}" >> "${GITHUB_OUTPUT}"

      - name: SonarQube scan
        id: scan
        uses: ravichandrapatel/gha-reusable-actions-workflows/actions/security/sonar-scan@sonar-scan/v1.2.0
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_host_url: ${{ inputs.sonar_host_url }}
          project_key: ${{ steps.sonar_meta.outputs.project_key }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          product: ${{ needs.build-preprocess.outputs.product }}
          platform: ${{ inputs.sonar_platform }}
          application_name: ${{ needs.build-preprocess.outputs.application_name }}
          app_build_type: maven
          args: ${{ needs.build-preprocess.outputs.sonar_cli_args }}

  publish:
    name: publish
    needs: [build-preprocess, build-and-unit-test, sonarqube]
    if: >-
      needs.build-and-unit-test.result == 'success'
      && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
      && (needs.build-preprocess.outputs.snapshot_artifact == 'true'
          || needs.build-preprocess.outputs.release_artifact == 'true')
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.deploy_environment }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Token for jgit/scm tag push (override with secrets.GIT_TOKEN when set)
          token: ${{ secrets.GIT_TOKEN || github.token }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ needs.build-preprocess.outputs.java_version }}
          cache: maven

      - name: Install Maven CLI
        env:
          MAVEN_VERSION: ${{ inputs.maven_version }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

          if [[ -n "${MAVEN_VERSION:-}" ]]; then
            version="${MAVEN_VERSION}"
          elif [[ -f pom.xml ]]; then
            version="$(
              grep -E '<maven\.version>' pom.xml \
                | sed -E 's#.*<maven\.version>[[:space:]]*([^<[:space:]]+)[[:space:]]*</maven\.version>.*#\1#' \
                | head -1 \
                | tr -d '[:space:]'
            )"
            version="${version:-3.9.9}"
          else
            version="3.9.9"
          fi

          echo "maven_version=${version}"
          cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/gha-tools}"
          install_dir="${cache_root}/Maven/${version}/x64"
          mvn_bin="${install_dir}/bin/mvn"

          if [[ ! -x "${mvn_bin}" ]]; then
            url="https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
            echo "Installing Apache Maven CLI ${version}"
            tmp="$(mktemp -d)"
            curl -fsSL "${url}" -o "${tmp}/maven.tgz"
            mkdir -p "${install_dir}"
            tar -xzf "${tmp}/maven.tgz" -C "${tmp}"
            cp -a "${tmp}/apache-maven-${version}/." "${install_dir}/"
            rm -rf "${tmp}"
          fi

          echo "MAVEN_HOME=${install_dir}" >> "${GITHUB_ENV}"
          echo "PATH=${install_dir}/bin:${PATH}" >> "${GITHUB_ENV}"
          echo "MAVEN_EXECUTABLE=${mvn_bin}" >> "${GITHUB_ENV}"
          "${mvn_bin}" -version

      - name: Maven publish to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        with:
          MAVEN_ARGS: >-
            ${{ inputs.maven_publish_args }}${{ needs.build-preprocess.outputs.checkstyle_skip == 'true' && ' -Dcheckstyle.skip=true' || '' }}

  docker-build:
    name: docker-build
    needs: [build-preprocess, build-and-unit-test, sonarqube]
    if: >-
      needs.build-and-unit-test.result == 'success'
      && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
      && needs.build-preprocess.outputs.docker == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Maven target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-target
          path: target

      - name: Check docker registry and builder image
        env:
          DOCKER_REGISTRY: ${{ inputs.docker_registry }}
          BUILDER_IMAGE: ${{ needs.build-preprocess.outputs.builder_base_image }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_REGISTRY}" ]]; then
            echo "ERROR: docker_registry is required when the docker stage runs" >&2
            exit 1
          fi
          if [[ -z "${BUILDER_IMAGE}" ]]; then
            echo "ERROR: BUILDER_BASE_IMAGE in build.values is required for S2I docker builds" >&2
            exit 1
          fi

      - name: Resolve application jar
        id: artifact
        env:
          ARTIFACT_ID: ${{ needs.build-preprocess.outputs.artifact_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(target/"${ARTIFACT_ID}"-*.jar target/*.jar)
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "ERROR: no jar found under target/ for artifact ${ARTIFACT_ID}" >&2
            exit 1
          fi
          JAR="${candidates[0]}"
          for path in "${candidates[@]}"; do
            case "${path}" in
              *-sources.jar|*-javadoc.jar|*.original.jar) continue ;;
            esac
            JAR="${path}"
            break
          done
          echo "jar_path=${JAR}" >> "${GITHUB_OUTPUT}"

      - name: Docker login
        uses: ravichandrapatel/gha-reusable-actions-workflows/actions/common/docker-login@docker-login/v1.2.0
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: S2I build and push
        id: push
        uses: ravichandrapatel/gha-reusable-actions-workflows/actions/common/s2i-build-and-push@s2i-build-and-push/v1.1.0
        with:
          builder_image: ${{ needs.build-preprocess.outputs.builder_base_image }}
          artifact_path: ${{ steps.artifact.outputs.jar_path }}
          app_build_type: maven
          registry: ${{ inputs.docker_registry }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          application: ${{ needs.build-preprocess.outputs.application_name }}
          project_version: ${{ needs.build-preprocess.outputs.project_version }}
          application_version: ${{ needs.build-preprocess.outputs.application_version }}
          environment: ${{ inputs.docker_environment }}
          branch: ${{ needs.build-preprocess.outputs.branch }}
