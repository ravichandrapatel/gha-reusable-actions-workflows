# =============================================================================
# FILE_NAME: workflow.yml
# DESCRIPTION: Reusable Maven CI — preprocess, build/test, OWASP, Sonar, Nexus deploy, S2I docker.
# VERSION: 1.4.0
# AUTHORS: DevOps Team
# =============================================================================

name: maven-build-pipeline

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'The runner to use for the build-preprocess job'
        required: false
        type: string
        default: '"ubuntu-latest"'
      skip-sonar:
        description: 'Whether to skip the Sonar stage'
        required: false
        type: boolean
        default: false
      skip-owasp:
        description: 'Whether to skip the OWASP stage'
        required: false
        type: boolean
        default: false
      skip-quality-gate-check:
        description: 'Whether to skip the quality gate check'
        required: false
        type: boolean
        default: false
      coverage-report-retention-days:
        description: 'The number of days to retain the coverage report'
        required: false
        type: number
        default: 1
      owasp-report-retention-days:
        description: 'The number of days to retain the OWASP report'
        required: false
        type: number
        default: 30
      build-artifact-retention-days:
        description: 'The number of days to retain the build artifact'
        required: false
        type: number
        default: 1
      publish-to-github-packages:
        description: 'Publish snapshot artifacts to GitHub Packages'
        required: false
        type: boolean
        default: false
      deploy_environment:
        description: 'GitHub Environment for contents:write release jobs'
        required: false
        type: string
        default: ci-publish

permissions:
  contents: read

jobs:
  build-preprocess:
    name: build-preprocess
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      build_stages: ${{ steps.preprocess.outputs.build_stages }}
      checkstyle_skip: ${{ steps.preprocess.outputs.checkstyle_skip }}
      cpgbuild_app_origin: ${{ steps.preprocess.outputs.cpgbuild_app_origin }}
      lib_01: ${{ steps.preprocess.outputs.lib_01 }}
      lib_02: ${{ steps.preprocess.outputs.lib_02 }}
      lib_03: ${{ steps.preprocess.outputs.lib_03 }}
      application_name: ${{ steps.preprocess.outputs.application_name }}
      application_version: ${{ steps.preprocess.outputs.application_version }}
      parent_version: ${{ steps.preprocess.outputs.parent_version }}
      project_version: ${{ steps.preprocess.outputs.project_version }}
      organization: ${{ steps.preprocess.outputs.organization }}
      product: ${{ steps.preprocess.outputs.product }}
      sonar_cli_args: ${{ steps.preprocess.outputs.sonar_cli_args }}
      branch: ${{ steps.preprocess.outputs.branch }}
      java_version: ${{ steps.preprocess.outputs.java_version }}
      name: ${{ steps.preprocess.outputs.name }}
      builder_base_image: ${{ steps.preprocess.outputs.builder_base_image }}
      is_library: ${{ steps.preprocess.outputs.is_library }}
      coverage_report_retention_days: ${{ inputs.coverage-report-retention-days }}
      owasp_report_retention_days: ${{ inputs.owasp-report-retention-days }}
      build_artifact_retention_days: ${{ inputs.build-artifact-retention-days }}
      skip_quality_gate_check: ${{ inputs.skip-quality-gate-check }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build preprocess
        id: preprocess
        uses: ./actions/common/build-preprocess
        with:
          app_build_type: maven

  build_and_unit_test:
    name: build_and_unit_test
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: build-preprocess
    if: contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'build_and_unit_test')
    steps:
      - *checkout
      - &setup-java
        name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ needs.build-preprocess.outputs.java_version }}
          distribution: 'temurin'
          cache: 'maven'

      - &setup-maven
        name: Setup Maven
        id: setup-maven
        shell: bash
        env:
          MAVEN_VERSION_DEFAULT: '3.9.9'
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

          if command -v mvn >/dev/null 2>&1; then
            mvn_bin="$(command -v mvn)"
            echo "mvn already available at ${mvn_bin}; skipping install"
            echo "MAVEN_EXECUTABLE=${mvn_bin}" >> "${GITHUB_ENV}"
            if [[ -z "${MAVEN_HOME:-}" ]]; then
              maven_home="$("${mvn_bin}" -version 2>/dev/null | sed -n 's/^Maven home:[[:space:]]*//p' | head -1)"
              [[ -n "${maven_home}" ]] && echo "MAVEN_HOME=${maven_home}" >> "${GITHUB_ENV}"
            fi
            "${mvn_bin}" -version
            detected="$("${mvn_bin}" -version 2>/dev/null | sed -n 's/^Apache Maven \([0-9][0-9.]*\).*/\1/p' | head -1)"
            echo "maven_version=${detected}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "mvn not on PATH; resolving version and installing"

          MAVEN_VERSION=""

          # Prefer Maven Wrapper pin, then pom <maven.version>, then enforcer requireMavenVersion.
          if [[ -f .mvn/wrapper/maven-wrapper.properties ]]; then
            MAVEN_VERSION="$(
              sed -n 's/.*apache-maven-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' \
                .mvn/wrapper/maven-wrapper.properties | head -1 || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from wrapper: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]] && [[ -f pom.xml ]]; then
            MAVEN_VERSION="$(
              grep -E '<maven\.version>' pom.xml \
                | sed -E 's#.*<maven\.version>[[:space:]]*([^<[:space:]]+)[[:space:]]*</maven\.version>.*#\1#' \
                | head -1 \
                | tr -d '[:space:]' || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from pom.xml <maven.version>: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]] && [[ -f pom.xml ]]; then
            MAVEN_VERSION="$(
              tr '\n' ' ' < pom.xml \
                | grep -oE '<requireMavenVersion>[^<]*<version>[^<]+</version>|<[rR]equireMavenVersion>[^<]+</[rR]equireMavenVersion>' \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from requireMavenVersion: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]]; then
            MAVEN_VERSION="${MAVEN_VERSION_DEFAULT:-3.9.9}"
            echo "Using default Maven version: ${MAVEN_VERSION}"
          fi

          echo "maven_version=${MAVEN_VERSION}" >> "${GITHUB_OUTPUT}"

          cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/gha-tools}"
          install_dir="${cache_root}/Maven/${MAVEN_VERSION}/x64"
          mvn_bin="${install_dir}/bin/mvn"

          if [[ ! -x "${mvn_bin}" ]]; then
            url="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            echo "Installing Apache Maven CLI ${MAVEN_VERSION} from ${url}"
            tmp="$(mktemp -d)"
            curl -fsSL "${url}" -o "${tmp}/maven.tgz"
            mkdir -p "${install_dir}"
            tar -xzf "${tmp}/maven.tgz" -C "${tmp}"
            cp -a "${tmp}/apache-maven-${MAVEN_VERSION}/." "${install_dir}/"
            rm -rf "${tmp}"
          else
            echo "Using cached Maven at ${install_dir}"
          fi

          {
            echo "MAVEN_HOME=${install_dir}"
            echo "PATH=${install_dir}/bin:${PATH}"
            echo "MAVEN_EXECUTABLE=${mvn_bin}"
          } >> "${GITHUB_ENV}"
          "${mvn_bin}" -version

      - name: Maven clean verify with unit tests
        uses: ./actions/common/maven
        with:
          MAVEN_ARGS: >-
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=error
            -B
            -Dcheckstyle.skip=${{ needs.build-preprocess.outputs.checkstyle_skip }}
            clean
            verify
            --activate-profiles
            coverage-per-test

      - name: Upload Maven build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-build-artifact-${{ github.run_number }}
          path: |
            target/
            */target/
          if-no-files-found: error
          retention-days: ${{ inputs.build-artifact-retention-days }}

  owasp:
    name: OWASP Dependency Check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: build-preprocess
    if: contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'owasp') && !inputs.skip-owasp
    steps:
      - &shallow-checkout
        name: Shallow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          private-key: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repositories: test/owasp-dependency-check-suppressions

      - name: Checkout owasp suppression repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: test/owasp-dependency-check-suppressions
          path: owasp-dependency-check-suppressions
          ref: master
          token: ${{ steps.generate-token.outputs.token }}

      - name: Resolve suppression file
        id: resolve-suppression
        env:
          PARENT_VERSION: ${{ needs.build-preprocess.outputs.parent_version }}
          APPLICATION_NAME: ${{ needs.build-preprocess.outputs.application_name }}
        run: |
          set -euo pipefail
          version="${PARENT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            echo "::error::parent_version is empty; cannot resolve OWASP suppression file" >&2
            exit 1
          fi

          major="$(printf '%s' "${version}" | sed -E 's/^([0-9]+).*/\1/')"
          case "${major}" in
            1|2|4)
              file="owasp-dc-suppression-v${major}.xml"
              ;;
            *)
              echo "::error::unsupported parent major version '${major}' from '${version}' (expected 1.x, 2.x, or 4.x)" >&2
              exit 1
              ;;
          esac

          app="${APPLICATION_NAME:-}"
          archetype="archetype-jsb-svc"

          path="owasp-dependency-check-suppressions/owasp-dependency-check/${archetype}/${file}"
          if [[ ! -f "${path}" ]]; then
            echo "::error::suppression file not found: ${path}" >&2
            ls -la "owasp-dependency-check-suppressions/owasp-dependency-check" >&2 || true
            exit 1
          fi

          echo "Resolved parent_version=${version} application_name=${app} → ${path}"
          echo "suppression_file=${path}" >> "${GITHUB_OUTPUT}"

      - name: OWASP Dependency Check
        uses: ./actions/security/owasp-dependency-check
        env:
          NEXUS_DOCKER_USERNAME: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          NEXUS_DOCKER_PASSWORD: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
        with:
          project: ${{ github.event.repository.name }}
          scan_profile: maven
          image: ${{ vars.NEXUS_DOCKER_REGISTRY_DEV }}/devcoe/github-runner/owasp-dependency-check:latest
          path: ./
          out: target
          format: ALL
          nvdApiKey: ${{ secrets.OWASP_DEPENDENCY_CHECK_NVD_API_KEY }}
          nvdApiDelay: 8000
          nvdValidForHours: 24
          nvdDatafeed: ${{ vars.NEXUS_HOST_URL }}/repository/owasp-dc-nvd-api/nvdcve-{0}.json.gz
          hostedSuppressionsUrl: ${{ vars.NEXUS_HOST_URL }}/repository/owasp-dc-group-raw/publishedSuppression.xml
          suppression: ${{ steps.resolve-suppression.outputs.suppression_file }}

      - name: Upload OWASP Dependency Check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-owasp-reports-${{ github.run_number }}
          path: |
            target/dependency-check-report.xml
            target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: ${{ inputs.owasp-report-retention-days }}

  sonar:
    name: Sonar-scan and quality gate check
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: [build-preprocess, build_and_unit_test, owasp]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      !inputs.skip-sonar &&
      needs.build-preprocess.result == 'success' &&
      needs.build_and_unit_test.result == 'success' &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'sonar') &&
      (needs.owasp.result == 'success' || needs.owasp.result == 'skipped')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - &maven-artifact
        name: Download Maven artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-build-artifact-${{ github.run_number }}
          path: .

      - &owasp-artifact
        name: Download OWASP Dependency Check artifact
        if: needs.owasp.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-owasp-reports-${{ github.run_number }}
          path: target/

      - name: Sonar-scan and quality gate check
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_ARTIFACT_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_ARTIFACT_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_INTERNAL_URL }}
        with:
          MAVEN_ARGS: >-
            sonar:sonar
            --activate-profiles
            coverage-per-test
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html
            -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json
            -Dsonar.branch.name=${{ needs.build-preprocess.outputs.branch }}

      - name: Sonar quality gate check
        if: ${{ !inputs.skip-quality-gate-check }}
        uses: ./actions/security/sonar-scan
        with:
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          sonar_host_url: ${{ vars.SONARQUBE_INTERNAL_URL }}
          project_key: ${{ needs.build-preprocess.outputs.application_name }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          product: ${{ needs.build-preprocess.outputs.product }}
          platform: cap
          application_name: ${{ needs.build-preprocess.outputs.application_name }}
          app_build_type: maven
          args: ${{ needs.build-preprocess.outputs.sonar_cli_args }}
          continue_on_error: 'false'

  sonar-pr:
    name: Sonar-scan and quality gate check (PR)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: [build-preprocess, build_and_unit_test, owasp]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !inputs.skip-sonar &&
      needs.build-preprocess.result == 'success' &&
      needs.build_and_unit_test.result == 'success' &&
      (needs.owasp.result == 'success' || needs.owasp.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'sonar')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *maven-artifact
      - *owasp-artifact
      - name: Sonar-scan and quality gate check
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_ARTIFACT_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_ARTIFACT_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_INTERNAL_URL }}
        with:
          MAVEN_ARGS: >-
            sonar:sonar
            --activate-profiles
            coverage-per-test
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html
            -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}

      - name: Sonar quality gate check
        if: ${{ !inputs.skip-quality-gate-check }}
        uses: ./actions/security/sonar-scan
        with:
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          sonar_host_url: ${{ vars.SONARQUBE_INTERNAL_URL }}
          project_key: ${{ needs.build-preprocess.outputs.application_name }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          product: ${{ needs.build-preprocess.outputs.product }}
          platform: cap
          application_name: ${{ needs.build-preprocess.outputs.application_name }}
          app_build_type: maven
          args: ${{ needs.build-preprocess.outputs.sonar_cli_args }}
          pr_key: ${{ github.event.pull_request.number }}
          pr_branch: ${{ github.event.pull_request.head.ref }}
          pr_base: ${{ github.event.pull_request.base.ref }}
          continue_on_error: 'false'

  nexus-artifacts:
    name: Nexus artifacts
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: [build-preprocess, sonar, sonar-pr]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (needs.sonar-pr.result == 'success' || needs.sonar-pr.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'snapshot_artifact')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *maven-artifact
      - &resolve-deploy-artifact
        name: Resolve deploy artifact from pom
        id: deploy-artifact
        env:
          PROJECT_VERSION: ${{ needs.build-preprocess.outputs.project_version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packaging="$(
            tr '\n' ' ' < pom.xml \
              | grep -oE '<packaging>[^<]+</packaging>' \
              | head -1 \
              | sed -E 's#</?packaging>##g' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]' || true
          )"
          packaging="${packaging:-jar}"
          candidates=(
            target/*-"${PROJECT_VERSION}"."${packaging}"
            */target/*-"${PROJECT_VERSION}"."${packaging}"
            target/*."${packaging}"
          )
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::no ${packaging} found under target/ for version ${PROJECT_VERSION}" >&2
            exit 1
          fi
          ARTIFACT="${candidates[0]}"
          for path in "${candidates[@]}"; do
            case "${path}" in
              *-sources.jar|*-javadoc.jar|*.original.jar) continue ;;
            esac
            ARTIFACT="${path}"
            break
          done
          echo "packaging=${packaging}"
          echo "file=${ARTIFACT}"
          echo "packaging=${packaging}" >> "${GITHUB_OUTPUT}"
          echo "file=${ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Deploy snapshot artifact to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_ARTIFACT_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_ARTIFACT_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
        with:
          MAVEN_ARGS: >-
            deploy:deploy-file
            -DgeneratePom=false
            -DrepositoryId=devtools-nexus-snapshots
            -DpomFile=pom.xml
            -Dpackaging=${{ steps.deploy-artifact.outputs.packaging }}
            -Durl=${{ vars.NEXUS_HOST_URL }}/repository/cpg-snapshots
            -Dfile=${{ steps.deploy-artifact.outputs.file }}

  github-packages:
    name: GitHub Packages
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: write
    needs: [build-preprocess, sonar, sonar-pr]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      inputs.publish-to-github-packages &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (needs.sonar-pr.result == 'success' || needs.sonar-pr.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'snapshot_artifact')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *maven-artifact
      - *resolve-deploy-artifact
      - &create-github-packages-token
        name: Create GitHub Packages token
        id: github-packages-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          private-key: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Deploy snapshot artifact to GitHub Packages
        uses: ./actions/common/maven
        env:
          GITHUB_TOKEN: ${{ steps.github-packages-token.outputs.token }}
        with:
          MAVEN_ARGS: >-
            deploy:deploy-file
            -DgeneratePom=false
            -DrepositoryId=github
            -DpomFile=pom.xml
            -Dpackaging=${{ steps.deploy-artifact.outputs.packaging }}
            -Durl=https://maven.pkg.github.com/${{ github.repository }}
            -Dfile=${{ steps.deploy-artifact.outputs.file }}

  release-nexus-artifacts:
    name: Release Nexus artifacts
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.deploy_environment }}
    permissions:
      contents: write
    needs: [build-preprocess, sonar, sonar-pr]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.sonar.result == 'success' &&
      (needs.sonar-pr.result == 'success' || needs.sonar-pr.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'release_artifact')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *create-github-packages-token
      - name: Deploy release artifact to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_ARTIFACT_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_ARTIFACT_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
          GITHUB_TOKEN: ${{ steps.github-packages-token.outputs.token }}
        with:
          MAVEN_ARGS: >-
            -B
            -Dmaven.scm.provider.git.implementation=jgit
            release:clean release:prepare release:perform
            -Darguments="-Dmaven.javadoc.skip=true"

  release-github-packages:
    name: Release GitHub Packages
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.deploy_environment }}
    permissions:
      contents: write
      packages: write
    needs: [build-preprocess, sonar, sonar-pr]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      inputs.publish-to-github-packages &&
      needs.sonar.result == 'success' &&
      (needs.sonar-pr.result == 'success' || needs.sonar-pr.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'release_artifact')
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *create-github-packages-token
      - name: Deploy release artifact to GitHub Packages
        uses: ./actions/common/maven
        env:
          GITHUB_TOKEN: ${{ steps.github-packages-token.outputs.token }}
        with:
          MAVEN_ARGS: >-
            -B
            -Dmaven.scm.provider.git.implementation=jgit
            release:clean release:prepare release:perform
            -Darguments="-Dmaven.javadoc.skip=true -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}"

  image-build:
    name: Image build
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    needs: [build-preprocess, build_and_unit_test, sonar, sonar-pr]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.build-preprocess.result == 'success' &&
      needs.build_and_unit_test.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      (needs.sonar-pr.result == 'success' || needs.sonar-pr.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'docker')
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - *shallow-checkout
      - *maven-artifact

      - name: Resolve application jar
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(
            target/*.jar
            */target/*.jar
            target/*.war
            */target/*.war
          )
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::no jar/war found under target/" >&2
            exit 1
          fi
          ARTIFACT="${candidates[0]}"
          for path in "${candidates[@]}"; do
            case "${path}" in
              *-sources.jar|*-javadoc.jar|*.original.jar) continue ;;
            esac
            ARTIFACT="${path}"
            break
          done
          echo "artifact_path=${ARTIFACT}"
          echo "artifact_path=${ARTIFACT}" >> "${GITHUB_OUTPUT}"

      # Builder: short names → registry.access.redhat.com (no login).
      # Push registry: vars.NEXUS_DOCKER_REGISTRY_DEV only.
      - name: Resolve builder and Nexus push registry
        id: images
        env:
          BUILDER_BASE_IMAGE: ${{ needs.build-preprocess.outputs.builder_base_image }}
          NEXUS_REGISTRY: ${{ vars.NEXUS_DOCKER_REGISTRY_DEV }}
          REDHAT_REGISTRY: registry.access.redhat.com
        run: |
          set -euo pipefail
          img="${BUILDER_BASE_IMAGE:?BUILDER_BASE_IMAGE from build.values is required}"
          img="${img#docker://}"
          if [[ "${img}" =~ ^[A-Za-z0-9._-]+\.[A-Za-z]{2,}/ ]]; then
            builder="${img}"
          else
            builder="${REDHAT_REGISTRY}/${img}"
          fi
          registry="${NEXUS_REGISTRY:-}"
          if [[ -z "${registry}" ]]; then
            echo "::error::vars.NEXUS_DOCKER_REGISTRY_DEV is required for image push" >&2
            exit 1
          fi
          registry="${registry%/}"
          {
            echo "builder_image=${builder}"
            echo "registry=${registry}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Nexus registry (image push)
        uses: ./actions/common/docker-login
        with:
          registry: ${{ steps.images.outputs.registry }}
          username: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          password: ${{ secrets.NEXUS_DOCKER_PASSWORD }}

      - name: S2I build and push
        id: push
        uses: ./actions/common/s2i-build-and-push
        with:
          builder_image: ${{ steps.images.outputs.builder_image }}
          artifact_path: ${{ steps.artifact.outputs.artifact_path }}
          app_build_type: maven
          registry: ${{ steps.images.outputs.registry }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          product: ${{ needs.build-preprocess.outputs.product }}
          application: ${{ needs.build-preprocess.outputs.application_name }}
          project_version: ${{ needs.build-preprocess.outputs.project_version }}
          parent_version: ${{ needs.build-preprocess.outputs.parent_version }}
          branch: ${{ needs.build-preprocess.outputs.branch }}


