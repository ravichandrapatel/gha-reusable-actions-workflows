# =============================================================================
# FILE_NAME: workflow.yml
# DESCRIPTION: Reusable Maven CI — preprocess, build/test, OWASP, Sonar, artifacts, S2I docker, notify.
# VERSION: 1.11.0
# AUTHORS: DevOps Team
# =============================================================================

name: maven-build-pipeline

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label (Podman required for OWASP)
        type: string
        required: false
        default: ubuntu-latest
      bot_name:
        description: Actor treated as auto-commit bot (preprocess skips other stages)
        type: string
        required: false
        default: ""
      sonar_host_url:
        description: SonarQube server URL
        type: string
        required: true
      sonar_project_key:
        description: Sonar project key; empty uses preprocess application_name
        type: string
        required: false
        default: ""
      sonar_platform:
        description: Sonar tag platform-<value>
        type: string
        required: false
        default: cap
      skip_sonar:
        description: 'Whether to skip the Sonar stage'
        required: false
        type: boolean
        default: false
      skip_owasp:
        description: 'Whether to skip the OWASP stage'
        required: false
        type: boolean
        default: false
      skip_quality_gate_check:
        description: 'Whether to skip the quality gate check'
        required: false
        type: boolean
        default: false
      coverage_report_retention_days:
        description: 'The number of days to retain the coverage report'
        required: false
        type: number
        default: 1
      owasp_report_retention_days:
        description: 'The number of days to retain the OWASP report'
        required: false
        type: number
        default: 30
      build_artifact_retention_days:
        description: 'The number of days to retain the build artifact'
        required: false
        type: number
        default: 1
      skip_notification:
        description: 'Whether to skip the final email notification job'
        required: false
        type: boolean
        default: false
      deploy_environment:
        description: 'GitHub Environment for contents:write release jobs'
        required: false
        type: string
        default: ci-publish
    outputs:
      stages:
        description: JSON array of stages to run
        value: ${{ jobs.build-preprocess.outputs.build_stages }}
      checkstyle_skip:
        description: true when CPGBUILD_APP_ORIGIN is set
        value: ${{ jobs.build-preprocess.outputs.checkstyle_skip }}
      cpgbuild_app_origin:
        description: From build.values CPGBUILD_APP_ORIGIN
        value: ${{ jobs.build-preprocess.outputs.cpgbuild_app_origin }}
      lib_01:
        description: Optional LIB_01 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_01 }}
      lib_02:
        description: Optional LIB_02 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_02 }}
      lib_03:
        description: Optional LIB_03 from build.values
        value: ${{ jobs.build-preprocess.outputs.lib_03 }}
      application_name:
        description: From project.values
        value: ${{ jobs.build-preprocess.outputs.application_name }}
      application_version:
        description: pom parent version when present, else project version
        value: ${{ jobs.build-preprocess.outputs.application_version }}
      parent_version:
        description: pom parent version
        value: ${{ jobs.build-preprocess.outputs.parent_version }}
      project_version:
        description: pom project version (SNAPSHOT stripped by read-maven-pom for publish)
        value: ${{ jobs.build-preprocess.outputs.project_version }}
      quality_gate_status:
        description: Sonar quality gate from sonarqube-gate
        value: ${{ jobs.sonarqube-gate.outputs.quality_gate_status }}
      docker_image:
        description: Pushed image reference
        value: ${{ jobs.docker-build.outputs.image }}

permissions:
  contents: read

jobs:
  build-preprocess:
    name: build-preprocess
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      build_stages: ${{ steps.preprocess.outputs.build_stages }}
      checkstyle_skip: ${{ steps.preprocess.outputs.checkstyle_skip }}
      cpgbuild_app_origin: ${{ steps.preprocess.outputs.cpgbuild_app_origin }}
      lib_01: ${{ steps.preprocess.outputs.lib_01 }}
      lib_02: ${{ steps.preprocess.outputs.lib_02 }}
      lib_03: ${{ steps.preprocess.outputs.lib_03 }}
      application_name: ${{ steps.preprocess.outputs.application_name }}
      application_version: ${{ steps.preprocess.outputs.application_version }}
      parent_version: ${{ steps.preprocess.outputs.parent_version }}
      project_version: ${{ steps.preprocess.outputs.project_version }}
      organization: ${{ steps.preprocess.outputs.organization }}
      product: ${{ steps.preprocess.outputs.product }}
      sonar_cli_args: ${{ steps.preprocess.outputs.sonar_cli_args }}
      branch: ${{ steps.preprocess.outputs.branch }}
      java_version: ${{ steps.preprocess.outputs.java_version }}
      name: ${{ steps.preprocess.outputs.name }}
      builder_base_image: ${{ steps.preprocess.outputs.builder_base_image }}
      is_library: ${{ steps.preprocess.outputs.is_library }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build preprocess
        id: preprocess
        uses: ./actions/common/build-preprocess
        with:
          app_build_type: maven
          bot_name: ${{ inputs.bot_name }}

  build-and-unit-test:
    name: build-and-unit-test
    needs: [build-preprocess]
    if: contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'build_and_unit_test')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - *checkout
      - &setup-java
        name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ needs.build-preprocess.outputs.java_version }}
          distribution: 'redhat'
          cache: 'maven'

      - &setup-maven
        name: Setup Maven
        id: setup-maven
        shell: bash
        env:
          MAVEN_VERSION_DEFAULT: '3.9.9'
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"

          if command -v mvn >/dev/null 2>&1; then
            mvn_bin="$(command -v mvn)"
            echo "mvn already available at ${mvn_bin}; skipping install"
            echo "MAVEN_EXECUTABLE=${mvn_bin}" >> "${GITHUB_ENV}"
            if [[ -z "${MAVEN_HOME:-}" ]]; then
              maven_home="$("${mvn_bin}" -version 2>/dev/null | sed -n 's/^Maven home:[[:space:]]*//p' | head -1)"
              [[ -n "${maven_home}" ]] && echo "MAVEN_HOME=${maven_home}" >> "${GITHUB_ENV}"
            fi
            "${mvn_bin}" -version
            detected="$("${mvn_bin}" -version 2>/dev/null | sed -n 's/^Apache Maven \([0-9][0-9.]*\).*/\1/p' | head -1)"
            echo "maven_version=${detected}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "mvn not on PATH; resolving version and installing"

          MAVEN_VERSION=""

          # Prefer Maven Wrapper pin, then pom <maven.version>, then enforcer requireMavenVersion.
          if [[ -f .mvn/wrapper/maven-wrapper.properties ]]; then
            MAVEN_VERSION="$(
              sed -n 's/.*apache-maven-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' \
                .mvn/wrapper/maven-wrapper.properties | head -1 || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from wrapper: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]] && [[ -f pom.xml ]]; then
            MAVEN_VERSION="$(
              grep -E '<maven\.version>' pom.xml \
                | sed -E 's#.*<maven\.version>[[:space:]]*([^<[:space:]]+)[[:space:]]*</maven\.version>.*#\1#' \
                | head -1 \
                | tr -d '[:space:]' || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from pom.xml <maven.version>: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]] && [[ -f pom.xml ]]; then
            MAVEN_VERSION="$(
              tr '\n' ' ' < pom.xml \
                | grep -oE '<requireMavenVersion>[^<]*<version>[^<]+</version>|<[rR]equireMavenVersion>[^<]+</[rR]equireMavenVersion>' \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true
            )"
            [[ -n "${MAVEN_VERSION}" ]] && echo "Resolved Maven version from requireMavenVersion: ${MAVEN_VERSION}"
          fi

          if [[ -z "${MAVEN_VERSION:-}" ]]; then
            MAVEN_VERSION="${MAVEN_VERSION_DEFAULT:-3.9.9}"
            echo "Using default Maven version: ${MAVEN_VERSION}"
          fi

          echo "maven_version=${MAVEN_VERSION}" >> "${GITHUB_OUTPUT}"

          cache_root="${RUNNER_TOOL_CACHE:-${HOME}/.cache/gha-tools}"
          install_dir="${cache_root}/Maven/${MAVEN_VERSION}/x64"
          mvn_bin="${install_dir}/bin/mvn"

          if [[ ! -x "${mvn_bin}" ]]; then
            url="https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
            echo "Installing Apache Maven CLI ${MAVEN_VERSION} from ${url}"
            tmp="$(mktemp -d)"
            curl -fsSL "${url}" -o "${tmp}/maven.tgz"
            mkdir -p "${install_dir}"
            tar -xzf "${tmp}/maven.tgz" -C "${tmp}"
            cp -a "${tmp}/apache-maven-${MAVEN_VERSION}/." "${install_dir}/"
            rm -rf "${tmp}"
          else
            echo "Using cached Maven at ${install_dir}"
          fi

          {
            echo "MAVEN_HOME=${install_dir}"
            echo "PATH=${install_dir}/bin:${PATH}"
            echo "MAVEN_EXECUTABLE=${mvn_bin}"
          } >> "${GITHUB_ENV}"
          "${mvn_bin}" -version

      - name: Maven clean verify with unit tests
        uses: ./actions/common/maven
        with:
          MAVEN_ARGS: >-
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=error
            -B
            -Dcheckstyle.skip=${{ needs.build-preprocess.outputs.checkstyle_skip }}
            clean
            verify
            --activate-profiles
            coverage-per-test

      - name: Upload Maven target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-target
          path: |
            target/
            */target/
            !target/site/**
            src/main/web/node/**
            src/main/web/coverage/**
          if-no-files-found: error
          retention-days: ${{ inputs.build_artifact_retention_days }}

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-coverage
          path: |
            target/site/**
          if-no-files-found: error
          retention-days: ${{ inputs.coverage_report_retention_days }}

  owasp:
    name: owasp
    needs: [build-preprocess]
    if: contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'owasp') && !inputs.skip_owasp
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - &shallow-checkout
        name: Shallow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Generate Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          private-key: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repositories: test/owasp-dependency-check-suppressions

      - name: Checkout owasp suppression repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: test/owasp-dependency-check-suppressions
          path: owasp-dependency-check-suppressions
          ref: master
          token: ${{ steps.generate-token.outputs.token }}

      - name: Resolve suppression file
        id: resolve-suppression
        env:
          PARENT_VERSION: ${{ needs.build-preprocess.outputs.parent_version }}
          APPLICATION_NAME: ${{ needs.build-preprocess.outputs.application_name }}
        run: |
          set -euo pipefail
          version="${PARENT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            echo "::error::parent_version is empty; cannot resolve OWASP suppression file" >&2
            exit 1
          fi

          major="$(printf '%s' "${version}" | sed -E 's/^([0-9]+).*/\1/')"
          case "${major}" in
            1|2|4)
              file="owasp-dc-suppression-v${major}.xml"
              ;;
            *)
              echo "::error::unsupported parent major version '${major}' from '${version}' (expected 1.x, 2.x, or 4.x)" >&2
              exit 1
              ;;
          esac

          app="${APPLICATION_NAME:-}"
          archetype="archetype-jsb-svc"

          path="owasp-dependency-check-suppressions/owasp-dependency-check/${archetype}/${file}"
          if [[ ! -f "${path}" ]]; then
            echo "::error::suppression file not found: ${path}" >&2
            ls -la "owasp-dependency-check-suppressions/owasp-dependency-check" >&2 || true
            exit 1
          fi

          echo "Resolved parent_version=${version} application_name=${app} → ${path}"
          echo "suppression_file=${path}" >> "${GITHUB_OUTPUT}"

      - name: owasp
        uses: ./actions/security/owasp-dependency-check
        with:
          project: ${{ needs.build-preprocess.outputs.application_name }}
          scan_profile: maven
          image: ${{ vars.NEXUS_DOCKER_REGISTRY_DEV }}/devcoe/github-runner/owasp-dependency-check:latest
          path: ./
          out: target
          format: ALL
          nvdApiKey: ${{ secrets.NVD_API_KEY }}
          nvdApiDelay: 8000
          nvdValidForHours: 24
          nvdDatafeed: ${{ vars.NEXUS_HOST_URL }}/repository/owasp-dc-nvd-api/nvdcve-{0}.json.gz
          hostedSuppressionsUrl: ${{ vars.NEXUS_HOST_URL }}/repository/owasp-dc-group-raw/publishedSuppression.xml
          suppression: ${{ steps.resolve-suppression.outputs.suppression_file }}

      - name: Upload OWASP Dependency Check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-report
          path: |
            target/dependency-check-report.xml
            target/dependency-check-report.html
          if-no-files-found: warn
          retention-days: ${{ inputs.owasp_report_retention_days }}

  sonarqube:
    name: sonarqube
    needs: [build-preprocess, build-and-unit-test, owasp]
    if: |
      always() &&
      !inputs.skip_sonar &&
      needs.build-preprocess.result == 'success' &&
      needs.build-and-unit-test.result == 'success' &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'sonar') &&
      (needs.owasp.result == 'success' || needs.owasp.result == 'skipped')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - &maven-artifact
        name: Download Maven target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-target
          path: .

      - &owasp-artifact
        name: Download OWASP reports
        if: needs.owasp.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owasp-report
          path: target/

      - name: Resolve Sonar project key
        id: sonar_meta
        env:
          KEY_IN: ${{ inputs.sonar_project_key }}
          APP: ${{ needs.build-preprocess.outputs.application_name }}
          BRANCH: ${{ needs.build-preprocess.outputs.branch }}
          EVENT: ${{ github.event_name }}
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          KEY="${KEY_IN:-${APP}}"
          if [[ ! "${KEY}" =~ ^[A-Za-z0-9_.:-]+$ ]]; then
            echo "ERROR: sonar project key '${KEY}' is invalid" >&2
            exit 1
          fi
          echo "project_key=${KEY}" >> "${GITHUB_OUTPUT}"
          if [[ "${EVENT}" == "pull_request" ]]; then
            extra="-Dsonar.pullrequest.key=${PR_KEY} -Dsonar.pullrequest.branch=${PR_BRANCH} -Dsonar.pullrequest.base=${PR_BASE}"
          else
            extra="-Dsonar.branch.name=${BRANCH}"
          fi
          {
            echo "extra<<EOF"
            echo "${extra}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: sonarqube
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          MAVEN_ARGS: >-
            sonar:sonar
            --activate-profiles
            coverage-per-test
            -Dsonar.host.url=${{ inputs.sonar_host_url }}
            -Dsonar.projectKey=${{ steps.sonar_meta.outputs.project_key }}
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html
            -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check-report.xml
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json
            ${{ steps.sonar_meta.outputs.extra }}

      - &stage-sonar-report-task
        name: Stage Sonar report-task
        run: |
          set -euo pipefail
          mkdir -p .scannerwork
          if [[ -f target/sonar/report-task.txt ]]; then
            cp -f target/sonar/report-task.txt .scannerwork/report-task.txt
          elif [[ -f .scannerwork/report-task.txt ]]; then
            :
          else
            echo "::error::missing Sonar report-task.txt (target/sonar or .scannerwork)" >&2
            exit 1
          fi

      - &upload-sonar-report-task
        name: Upload Sonar report-task
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-report-task
          path: .scannerwork/report-task.txt
          if-no-files-found: error
          retention-days: 1

  read-maven-pom:
    name: read-maven-pom
    needs: [build-preprocess, sonarqube]
    if: |
      always() &&
      needs.build-preprocess.result == 'success' &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      group_id: ${{ steps.pom.outputs.group_id }}
      artifact_id: ${{ steps.pom.outputs.artifact_id }}
      packaging: ${{ steps.pom.outputs.packaging }}
      version: ${{ steps.pom.outputs.version }}
      is_multi_module: ${{ steps.pom.outputs.is_multi_module }}
    steps:
      - *shallow-checkout
      - name: read-maven-pom
        id: pom
        uses: ./actions/common/read-maven-pom

  sonarqube-gate:
    name: sonarqube-gate
    needs: [build-preprocess, sonarqube, read-maven-pom]
    if: |
      always() &&
      !inputs.skip_sonar &&
      !inputs.skip_quality_gate_check &&
      needs.read-maven-pom.result == 'success' &&
      needs.sonarqube.result == 'success'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      quality_gate_status: ${{ steps.gate.outputs.quality-gate-status }}
    steps:
      - name: Download Sonar report-task
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-report-task
          path: .scannerwork

      - name: SonarQube quality gate
        id: gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}

  multi-module-artifacts:
    name: multi-module-artifacts
    needs: [build-preprocess, read-maven-pom, sonarqube, sonarqube-gate]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.read-maven-pom.result == 'success' &&
      needs.read-maven-pom.outputs.is_multi_module == 'true' &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') &&
      (needs.sonarqube-gate.result == 'success' || needs.sonarqube-gate.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'snapshot_artifact')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *maven-artifact
      - name: Deploy multi-module snapshot artifacts to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
        with:
          MAVEN_ARGS: >-
            -B
            -DskipTests
            -Dcheckstyle.skip=${{ needs.build-preprocess.outputs.checkstyle_skip }}
            deploy

  nexus-maven-artifacts:
    name: nexus-maven-artifacts
    needs: [build-preprocess, read-maven-pom, sonarqube, sonarqube-gate]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.read-maven-pom.result == 'success' &&
      needs.read-maven-pom.outputs.is_multi_module != 'true' &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') &&
      (needs.sonarqube-gate.result == 'success' || needs.sonarqube-gate.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'snapshot_artifact')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - *maven-artifact
      - &resolve-deploy-artifact
        name: Resolve deploy artifact
        id: deploy-artifact
        env:
          PROJECT_VERSION: ${{ needs.read-maven-pom.outputs.version }}
          PACKAGING: ${{ needs.read-maven-pom.outputs.packaging }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packaging="${PACKAGING:-jar}"
          version="${PROJECT_VERSION:?version from read-maven-pom is required}"
          candidates=(
            target/*-"${version}"."${packaging}"
            target/*-"${version}-SNAPSHOT"."${packaging}"
            */target/*-"${version}"."${packaging}"
            */target/*-"${version}-SNAPSHOT"."${packaging}"
            target/*."${packaging}"
          )
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::no ${packaging} found under target/ for version ${version}" >&2
            exit 1
          fi
          ARTIFACT="${candidates[0]}"
          for path in "${candidates[@]}"; do
            case "${path}" in
              *-sources.jar|*-javadoc.jar|*.original.jar) continue ;;
            esac
            ARTIFACT="${path}"
            break
          done
          echo "file=${ARTIFACT}"
          echo "file=${ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Deploy snapshot artifact to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
        with:
          MAVEN_ARGS: >-
            deploy:deploy-file
            -DgeneratePom=false
            -DrepositoryId=devtools-nexus-snapshots
            -DpomFile=pom.xml
            -Dpackaging=${{ needs.read-maven-pom.outputs.packaging }}
            -Durl=${{ vars.NEXUS_HOST_URL }}/repository/cpg-snapshots
            -Dfile=${{ steps.deploy-artifact.outputs.file }}

  release-artifact:
    name: release-artifact
    needs: [build-preprocess, read-maven-pom, sonarqube, sonarqube-gate]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.read-maven-pom.result == 'success' &&
      needs.sonarqube.result == 'success' &&
      (needs.sonarqube-gate.result == 'success' || needs.sonarqube-gate.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'release_artifact')
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.deploy_environment }}
    permissions:
      contents: write
    steps:
      - *shallow-checkout
      - *setup-java
      - *setup-maven
      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          private-key: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Deploy release artifact to Nexus
        uses: ./actions/common/maven
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_BASEURL: ${{ vars.NEXUS_HOST_URL }}
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        with:
          MAVEN_ARGS: >-
            -B
            -Dmaven.scm.provider.git.implementation=jgit
            release:clean release:prepare release:perform
            -Darguments="-Dmaven.javadoc.skip=true"

  docker-build:
    name: docker-build
    needs: [build-preprocess, build-and-unit-test, read-maven-pom, sonarqube, sonarqube-gate, multi-module-artifacts, nexus-maven-artifacts, release-artifact]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.build-preprocess.result == 'success' &&
      needs.build-and-unit-test.result == 'success' &&
      needs.read-maven-pom.result == 'success' &&
      (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') &&
      (needs.sonarqube-gate.result == 'success' || needs.sonarqube-gate.result == 'skipped') &&
      (needs.multi-module-artifacts.result == 'success' || needs.multi-module-artifacts.result == 'skipped') &&
      (needs.nexus-maven-artifacts.result == 'success' || needs.nexus-maven-artifacts.result == 'skipped') &&
      (needs.release-artifact.result == 'success' || needs.release-artifact.result == 'skipped') &&
      contains(fromJSON(needs.build-preprocess.outputs.build_stages), 'docker')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - *shallow-checkout
      - *maven-artifact

      - name: Resolve application jar
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(
            target/*.jar
            */target/*.jar
            target/*.war
            */target/*.war
          )
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "::error::no jar/war found under target/" >&2
            exit 1
          fi
          ARTIFACT="${candidates[0]}"
          for path in "${candidates[@]}"; do
            case "${path}" in
              *-sources.jar|*-javadoc.jar|*.original.jar) continue ;;
            esac
            ARTIFACT="${path}"
            break
          done
          echo "artifact_path=${ARTIFACT}"
          echo "artifact_path=${ARTIFACT}" >> "${GITHUB_OUTPUT}"

      # Builder: short names → registry.access.redhat.com (no login).
      # Push registry: vars.NEXUS_DOCKER_REGISTRY_DEV only.
      - name: Resolve builder and Nexus push registry
        id: images
        env:
          BUILDER_BASE_IMAGE: ${{ needs.build-preprocess.outputs.builder_base_image }}
          NEXUS_REGISTRY: ${{ vars.NEXUS_DOCKER_REGISTRY_DEV }}
          REDHAT_REGISTRY: registry.access.redhat.com
        run: |
          set -euo pipefail
          img="${BUILDER_BASE_IMAGE:?BUILDER_BASE_IMAGE from build.values is required}"
          img="${img#docker://}"
          if [[ "${img}" =~ ^[A-Za-z0-9._-]+\.[A-Za-z]{2,}/ ]]; then
            builder="${img}"
          else
            builder="${REDHAT_REGISTRY}/${img}"
          fi
          registry="${NEXUS_REGISTRY:-}"
          if [[ -z "${registry}" ]]; then
            echo "::error::vars.NEXUS_DOCKER_REGISTRY_DEV is required for image push" >&2
            exit 1
          fi
          registry="${registry%/}"
          {
            echo "builder_image=${builder}"
            echo "registry=${registry}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Nexus registry (image push)
        uses: ./actions/common/docker-login
        with:
          registry: ${{ steps.images.outputs.registry }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: S2I build and push
        id: push
        uses: ./actions/common/s2i-build-and-push
        with:
          builder_image: ${{ steps.images.outputs.builder_image }}
          artifact_path: ${{ steps.artifact.outputs.artifact_path }}
          app_build_type: maven
          registry: ${{ steps.images.outputs.registry }}
          organization: ${{ needs.build-preprocess.outputs.organization }}
          product: ${{ needs.build-preprocess.outputs.product }}
          application: ${{ needs.build-preprocess.outputs.application_name }}
          project_version: ${{ needs.read-maven-pom.outputs.version }}
          parent_version: ${{ needs.read-maven-pom.outputs.version }}
          branch: ${{ needs.build-preprocess.outputs.branch }}

  notification-email:
    name: notification-email
    needs:
      - build-preprocess
      - build-and-unit-test
      - owasp
      - sonarqube
      - read-maven-pom
      - sonarqube-gate
      - multi-module-artifacts
      - nexus-maven-artifacts
      - release-artifact
      - docker-build
    if: always() && !inputs.skip_notification
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Send pipeline notification email
        if: always()
        uses: ./actions/common/notification-email
        with:
          github_token: ${{ secrets.ORG_READ_TOKEN != '' && secrets.ORG_READ_TOKEN || github.token }}
          email_domain: ${{ vars.NOTIFICATION_EMAIL_DOMAIN }}
          smtp_host: ${{ secrets.SMTP_HOST }}
          smtp_username: ${{ secrets.SMTP_USERNAME }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          smtp_from: ${{ secrets.SMTP_FROM }}
          subject: 'Maven CI {repository} #{run_number}'
          template_vars: >-
            {"application_name":"${{ needs.build-preprocess.outputs.application_name }}","version":"${{ needs.read-maven-pom.outputs.version }}","is_multi_module":"${{ needs.read-maven-pom.outputs.is_multi_module }}"}


