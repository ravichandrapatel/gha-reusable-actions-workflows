# =============================================================================
# FILE_NAME: workflow.yaml
# DESCRIPTION: Reusable ng-ui build pipeline (preprocess → build → OWASP/Sonar).
# VERSION: 1.0.0
# AUTHORS: Platform / DevOps
# =============================================================================

name: NG-UI Build Pipeline

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'JSON array of runner labels'
        required: false
        type: string
        default: '["self-hosted","el9"]'
      build-command:
        description: 'Shell command to build the app'
        required: false
        type: string
        default: 'npm run build'
      lint-command:
        description: 'Shell command to lint (skipped when empty)'
        required: false
        type: string
        default: 'npm run lint:prod'
      test-command:
        description: 'Shell command to test (skipped when empty)'
        required: false
        type: string
        default: 'npm run test:cov'
      semantic-release:
        description: 'When true, run publish using preprocess snapshot_artifact / release_artifact gates'
        required: false
        type: boolean
        default: true
      enable_sonar:
        description: 'Run Sonar scan + quality gate when preprocess gate allows'
        required: false
        type: boolean
        default: true
      enable_owasp:
        description: 'Run OWASP dependency-check when preprocess gate allows'
        required: false
        type: boolean
        default: true
      sonar_host_url:
        description: 'SonarQube server URL (required when enable_sonar is true)'
        required: false
        type: string
        default: ''
      owasp_suppression_file:
        description: 'OWASP suppression XML path relative to the suppression checkout (.owasp-suppression) or caller workspace; empty skips suppressions'
        required: false
        type: string
        default: ''
    secrets:
      SONARQUBE_TOKEN:
        description: 'SonarQube authentication token used by scan and quality-gate actions'
        required: false
      OWASP_DEPENDENCY_CHECK_NVD_API_KEY:
        description: 'NVD API key passed to OWASP Dependency-Check (nvdApiKey)'
        required: false
      NEXUS_HOST_URL:
        description: 'Nexus repository manager base URL for artifact publish/download'
        required: false
      NEXUS_DOCKER_REGISTRY:
        description: 'Nexus Docker registry host/URL for image push/pull (reserved for docker job)'
        required: false
      NEXUS_DOCKER_USERNAME:
        description: 'Username for authenticating to the Nexus Docker registry'
        required: false
      NEXUS_DOCKER_PASSWORD:
        description: 'Password or token for authenticating to the Nexus Docker registry'
        required: false
      NEXUS_ARTIFACT_USERNAME:
        description: 'Username for Nexus Maven/npm artifact repository authentication'
        required: false
      NEXUS_ARTIFACT_PASSWORD:
        description: 'Password or token for Nexus Maven/npm artifact repository authentication'
        required: false
      EMAIL_TOKEN:
        description: 'Token used to send pipeline notification emails (reserved for notify job)'
        required: false
      REDHAT_REGISTRY_USERNAME:
        description: 'Username for Red Hat container registry authentication'
        required: false
      REDHAT_REGISTRY_PASSWORD:
        description: 'Password or token for Red Hat container registry authentication'
        required: false
      DEVSECOPS_CLIENT_ID:
        description: 'GitHub App / DevSecOps client ID for elevated automation (reserved)'
        required: false
      DEVSECOPS_APP_PRIVATE_KEY:
        description: 'GitHub App / DevSecOps private key PEM for elevated automation (reserved)'
        required: false
      NODE_AUTH_TOKEN:
        description: 'npm auth token for private registries during npm ci / publish'
        required: false

jobs:
  preprocess:
    name: Build preprocess
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      node_version: ${{ steps.pp.outputs.node_version }}
      application_version: ${{ steps.pp.outputs.application_version }}
      APPLICATION_NAME: ${{ steps.pp.outputs.APPLICATION_NAME }}
      APP_BUILD_TYPE: ${{ steps.pp.outputs.app_build_type }}
      build_and_unit_test: ${{ steps.pp.outputs.build_and_unit_test }}
      owasp: ${{ steps.pp.outputs.owasp }}
      sonar: ${{ steps.pp.outputs.sonar }}
      branch: ${{ steps.pp.outputs.branch }}
      snapshot_artifact: ${{ steps.pp.outputs.snapshot_artifact }}
      release_artifact: ${{ steps.pp.outputs.release_artifact }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog

      - name: Resolve platform actions repository
        id: platform
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # [T-00] owner/repo from workflow_ref (callee repo hosting ./actions)
          repo="$(printf '%s\n' "${WORKFLOW_REF}" | cut -d'/' -f1-2)"
          if [[ -z "${repo}" || "${repo}" != */* ]]; then
            echo "ERROR: could not resolve platform repository from workflow_ref=${WORKFLOW_REF}" >&2
            exit 1
          fi
          echo "repository=${repo}" >> "${GITHUB_OUTPUT}"

      - name: Build preprocess
        id: pp
        uses: ./actions/common/build-preprocess
        with:
          repo: ${{ github.event.repository.name }}
          app_build_type: ng-ui
          workspace: ${{ github.workspace }}

  build_and_unit_test:
    name: Build lint and unit test
    needs: preprocess
    if: needs.preprocess.outputs.build_and_unit_test == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog

      - name: Setup Node.js
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1 # setup-node main
        with:
          node-version: ${{ needs.preprocess.outputs.node_version }}
          cache: npm
          check-latest: false

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --force --no-audit --no-fund
          npm install -g @nestjs/cli --no-audit --no-fund --legacy-peer-deps 
          npm install @angular/localize @gilsdav/ngx-translate-router axios --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        if: inputs.lint-command != ''
        shell: bash
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          set -euo pipefail
          # [T-01] Caller-provided lint command
          bash -lc "${LINT_COMMAND}"

      - name: Test
        if: inputs.test-command != ''
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          # [T-03] Caller-provided test command
          bash -lc "${TEST_COMMAND} --runInBand --logHeapUsage"

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-coverage-${{ github.run_number }}
          path: |
            coverage/**
            junit.xml
          retention-days: 1

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          # [T-02] Caller-provided build command
          bash -lc "${BUILD_COMMAND}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-build-${{ github.run_number }}
          path: |
            dist/
            package-lock.json
            package.json
          retention-days: 1

  owasp:
    name: OWASP dependency check
    needs: [preprocess, build_and_unit_test]
    if: >-
      inputs.enable_owasp
      && needs.preprocess.outputs.owasp == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Generate Token
        uses: actions/create-github-app-token@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        id: generate-owasp-token
        with:
          client-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          client-secret: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repository: owasp/dependency-check-suppression-files
          branch: master
          owner: owasp

      - name: Checkout owasp suppression repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        with:
          fetch-depth: 0
          persist-credentials: false
          path: .owasp-suppression
          token: ${{ steps.generate-owasp-token.outputs.token }}
          repository: owasp/dependency-check-suppression-files
          branch: master

      - name: Resolve suppression files
        shell: bash
        env:
           INPUT_SUPPRESSION_FILE: ${{ inputs.owasp_suppression_file }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SUPPRESSION_FILE}" ]]; then
            echo "path=owasp-suppression/$INPUT_SUPPRESSION_FILE" >> "${GITHUB_OUTPUT}"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
          
      - name: OWASP Dependency-Check
        uses: ./actions/security/owasp-dependency-check
        env:
          NEXUS_DOCKER_USERNAME: ${{ secrets.NEXUS_DOCKER_USERNAME }}
          NEXUS_DOCKER_PASSWORD: ${{ secrets.NEXUS_DOCKER_PASSWORD }}
          NEXUS_HOST_URL: ${{ secrets.NEXUS_HOST_URL }}
        with:
          project: ${{ github.event.repository.name }}
          path: ./
          format: ALL
          nvdApiKey: ${{ secrets.OWASP_DEPENDENCY_CHECK_NVD_API_KEY }}
          nvdApiDelay: 10
          nvdValidForHours: 24
          nvdDataFeed: ${{ secrets.NEXUS_HOST_URL }}/repository/owasp-dc-nvd-api/nvdcve-{0}.json.gz
          hostedSuppressionUrl: ${{ secrets.NEXUS_HOST_URL }}/repository/owasp-dc-group-raw/publishedSuppression.xml
          supression: ${{ steps.resolve-suppression-files.outputs.path }}
          out: reports
          exclude: "**/node_modules/**, **/dist/**, **/build/**, **/coverage/**, **/reports/**, **/tmp/**, **/.git/**, **/.github/**, **/.vscode/**, **/.history/**, **/.env*/**"
          nodePacksgeSkipDevDependencies: true
          nodeAudtiSkipDevDependencies: true
          disableRetries: false
          disableFileName: false
          retireJsUrl: ${{ secrets.NEXUS_HOST_URL }}/repository/owasp-dc-group-raw/retire.js-2.31.0.json
          prettyPrint: true

      - name: Upload OWASP reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-owasp-reports-${{ github.run_number }}
          path: reports
          retention-days: 30

  sonar:
    name: SonarQube scan and quality gate
    needs: [preprocess, build_and_unit_test]
    if: >-
      inputs.enable_sonar
      && needs.preprocess.outputs.sonar == 'true'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        with:
          fetch-depth: 0
          
      - name: Download OWASP reports
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-owasp-reports-${{ github.run_number }}
          path: reports


      - name: Download test coverage artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-coverage-${{ github.run_number }}
          path: coverage

      - name: SonarQube properties
        shell: bash
        env:
          APPLICATION_NAME: ${{ needs.preprocess.outputs.APPLICATION_NAME }}
          APP_BUILD_TYPE: ${{ needs.preprocess.outputs.APP_BUILD_TYPE }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        run: |
          set -euo pipefail
          PROPERTIES_FILE="sonar-project.properties"

          [ ! -f "${PROPERTIES_FILE}" ] && touch "${PROPERTIES_FILE}"

          {
           echo ""
           echo "# Added by NG-UI Build Pipeline"
           echo "sonar.dependencyCheck.htmlReportPath=reports/dependency-check-report.html"
           echo "sonar.dependencyCheck.jsonReportPath=reports/dependency-check-report.json"
           echo ""
          } >> "${PROPERTIES_FILE}"

          if [ -n "${APPLICATION_NAME}" ]; then
            echo "sonar.projectName=${APPLICATION_NAME}" >> "${PROPERTIES_FILE}"
          fi

          if [ -f "coverage/lcov.info" ]; then
            echo "sonar.javascript.lcov.reportPaths=coverage/lcov.info" >> "${PROPERTIES_FILE}"
          fi

          sed -i 's|^sonar.sources=apps|sonar.sources=apps,package-lock.json|g' "${PROPERTIES_FILE}"
          sed -i 's|^sonar.inclusions=|sonar.inclusions=package-lock.json|g' "${PROPERTIES_FILE}"

          echo "== Final consolidated SonarQube properties =="
          cat "${PROPERTIES_FILE}"
      
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@7451daf950bc136c497f29045f2b4d4f9f7ba43a # pin-catalog
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_PROJECT_TAGS: ${{ needs.preprocess.outputs.APP_BUILD_TYPE }}

      - name: SonarQube quality gate
        uses: sonarsource/sonarqube-quality-gate-action@8e9b0ca0a7273d6f16986388d98393efdfcf56fd # pin-catalog
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}

  publish:
    name: Publish npm package
    needs: [preprocess, build_and_unit_test, owasp, sonar]
    if: >-
      always()
      && inputs.semantic-release
      && needs.preprocess.result == 'success'
      && needs.build_and_unit_test.result == 'success'
      && (needs.owasp.result == 'success' || needs.owasp.result == 'skipped')
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
      && (
        needs.preprocess.outputs.snapshot_artifact == 'true'
        || needs.preprocess.outputs.release_artifact == 'true'
      )
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        id: generate-token
        with:
          client-id: ${{ secrets.DEVSECOPS_CLIENT_ID }}
          client-secret: ${{ secrets.DEVSECOPS_APP_PRIVATE_KEY }}
          repository: ${{ github.event.repository.name }}

      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin-catalog
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

 
      - name: Download build artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # pin-catalog
        with:
          name: ${{ github.event.repository.name }}-build-${{ github.run_number }}
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1 # setup-node main
        with:
          node-version: ${{ needs.preprocess.outputs.node_version }}
          cache: npm
          check-latest: false

      - name: Run Semantic Release
        if: inputs.semantic-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          npx semantic-release

docker:   